8.5a5 5 0 0 1 0 7\"/>\u003cpath d=\"M18.5 5.5a9 9 0 0 1 0 13\"/>',\n  mic:'\u003cpath d=\"M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z\"/>\u003cpath d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"/>',\n  slow:'\u003cpath d=\"M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9\"/>',\n  check:'\u003cpath d=\"M5 12l5 5 9-10\"/>',\n  trash:'\u003cpath d=\"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13\"/>',\n  undo:'\u003cpath d=\"M9 14 4 9l5-5\"/>\u003cpath d=\"M4 9h10a6 6 0 0 1 0 12h-3\"/>',\n  eye:'\u003cpath d=\"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>',\n  moon:'\u003cpath d=\"M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z\"/>',\n  sun:'\u003ccircle cx=\"12\" cy=\"12\" r=\"4\"/>\u003cpath d=\"M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5\"/>',\n  wave:'\u003cpath d=\"M2 12c2-6 4-6 6 0s4 6 6 0 4-6 6 0\"/>',\n  stop:'\u003crect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"2\"/>',\n  pen:'\u003cpath d=\"M12 20h9\"/>\u003cpath d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"/>'\n};\nfunction ic(name,size=20){ return `\u003csvg viewBox=\"0 0 24 24\" width=\"${size}\" height=\"${size}\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${ICONS[name]||''}\u003c/svg>`; }\nfunction hydrateIcons(root=document){ $$('[data-ic]',root).forEach(el=>{ el.innerHTML = ic(el.dataset.ic, +el.dataset.size||20); el.style.display='inline-flex'; }); }\n\nlet toastTimer;\nfunction toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }\n\nfunction updateProgress(){\n  const p = state.letters.size/LETTERS.length*30 + state.tones.size/TONES.length*15 + state.words.size/ALLWORDS.length*20 + state.phrases.size/ALLPHRASES.length*20 + state.best/10*15;\n  const v = Math.min(100, Math.round(p));\n  $('#progFill').style.width = v+'%';\n  $('#progPct').textContent = '進捗 '+v+'%';\n}\n\n/* =========================================================\n   3. PHÁT ÂM (Web Speech API + âm điệu thanh điệu tạo bằng Web Audio)\n   ========================================================= */\nlet viVoice = null, speechToken = 0, curAudio = null;\nconst REC = new Map();                       // văn bản → {blob, mime, ts, dur}\n// Khi chạy trong ứng dụng chủ (iframe), giọng thu được lưu/chia sẻ qua Firestore bằng \"cầu nối\" của trang chủ.\n// Chạy độc lập (không có cầu nối) thì lưu cục bộ như trước và ai cũng thu được.\nconst BRIDGE = (()=>{ try{ return (window.parent && window.parent!==window && window.parent.TV_VOICE) ? window.parent.TV_VOICE : null; }catch(e){ return null; } })();\nconst CAN_RECORD = BRIDGE ? !!BRIDGE.isAdmin() : true;   // chỉ admin được thu âm / xóa / nhập sao lưu\nlet useRec = CAN_RECORD ? store.get('userec', true) : true;   // người học luôn nghe giọng thật nếu có\nconst hasTTS = 'speechSynthesis' in window;\nfunction loadVoices(){\n  if(!hasTTS) return;\n  const all = speechSynthesis.getVoices();\n  const vi = all.filter(v=>/^vi/i.test(v.lang));\n  const saved = store.get('voice', null);\n  // Ưu tiên: giọng người dùng đã chọn → giọng tự nhiên quen thuộc → giọng tiếng Việt đầu tiên\n  viVoice = vi.find(v=>v.name===saved) || vi.find(v=>/HoaiMy|NamMinh|Linh|Google/i.test(v.name)) || vi[0] || null;\n  const sel = $('#voiceSel');\n  if(sel){\n    sel.innerHTML = vi.length ? vi.map(v=>`\u003coption value=\"${v.name}\" ${viVoice&&v.name===viVoice.name?'selected':''}>${v.name}\u003c/option>`).join('') : '\u003coption>ベトナム語の音声がありません\u003c/option>';\n    sel.disabled = !vi.length;\n  }\n  if(all.length && !viVoice) $('#voiceNotice').classList.add('show'); else $('#voiceNotice').classList.remove('show');\n}\nif(hasTTS){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; setTimeout(loadVoices,1200); }\n\nfunction mkUtter(text, slow){\n  const u = new SpeechSynthesisUtterance(text);\n  u.lang = viVoice ? viVoice.lang : 'vi-VN';\n  if(viVoice) u.voice = viVoice;\n  u.rate = slow ? 0.7 : 1; u.pitch = 1;\n  return u;\n}\nfunction stopAllAudio(){\n  speechToken++;\n  if(curAudio){ const a=curAudio; curAudio=null; try{ a.pause(); }catch(e){} if(a.__fin) a.__fin(false); }\n  if(hasTTS) speechSynthesis.cancel();\n}\n// Phát giọng đã thu; trả về Promise\u003ctrue/false> (false = không phát được)\nfunction playRecorded(text, slow=false){\n  return new Promise(res=>{\n    const rec = REC.get(text); if(!rec){ res(false); return; }\n    let url; try{ url = URL.createObjectURL(rec.blob); }catch(e){ res(false); return; }\n    const a = new Audio(url); curAudio = a;\n    a.playbackRate = slow ? 0.75 : 1;\n    if('preservesPitch' in a) a.preservesPitch = true;\n    let finished = false;\n    const fin = ok => { if(finished) return; finished = true; try{ URL.revokeObjectURL(url); }catch(e){} if(curAudio===a) curAudio=null; res(ok); };\n    a.__fin = fin; a.onended = () => fin(true); a.onerror = () => fin(false);\n    const p = a.play(); if(p && p.catch) p.catch(() => fin(false));\n  });\n}\nfunction ttsOnce(text, slow){\n  return new Promise(res=>{\n    if(!hasTTS){ res(); return; }\n    const u = mkUtter(text, slow); let d = false;\n    const f = () => { if(!d){ d = true; res(); } };\n    u.onend = f; u.onerror = f; setTimeout(f, 10000);\n    speechSynthesis.speak(u);\n  });\n}\nfunction speak(text, slow=false){\n  stopAllAudio(); const my = speechToken;\n  const viaTTS = () => { if(!hasTTS){ toast('このブラウザは音声の再生に対応していません。'); return; } setTimeout(()=>{ if(my===speechToken) speechSynthesis.speak(mkUtter(text,slow)); }, 60); };\n  if(useRec && REC.has(text)){ playRecorded(text, slow).then(ok=>{ if(!ok && my===speechToken) viaTTS(); }); return; }\n  viaTTS();\n}\n// Đọc lần lượt nhiều từ, có khoảng nghỉ giữa các từ để nghe rõ sự khác biệt\nasync function speakSeq(list, slow=false, gap=600){\n  stopAllAudio(); const my = speechToken;\n  if(!hasTTS && !list.some(t=>useRec && REC.has(t))){ toast('このブラウザは音声の再生に対応していません。'); return; }\n  await new Promise(r=>setTimeout(r,60));\n  for(const t of list){\n    if(my!==speechToken) return;\n    let ok = false;\n    if(useRec && REC.has(t)) ok = await playRecorded(t, slow);\n    if(my!==speechToken) return;\n    if(!ok) await ttsOnce(t, slow);\n    if(my!==speechToken) return;\n    await new Promise(r=>setTimeout(r,gap));\n  }\n}\n\n// ----- Âm điệu thanh điệu: phát một âm theo đúng đường cong cao độ -----\nlet actx = null;\nfunction audioCtx(){\n  if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; actx = new AC(); }\n  if(actx.state==='suspended') actx.resume();\n  return actx;\n}\nfunction playMelody(t){\n  const ac = audioCtx();\n  if(!ac){ toast('このブラウザはピッチ音の再生に対応していません。'); return 0; }\n  const t0 = ac.currentTime + 0.05, dur = t.n==='nặng' ? 0.5 : 0.95;\n  const X = x => t0 + (x-8)/84*dur;                       // vị trí ngang → thời gian\n  const F = y => 200*Math.pow(2, ((30-y)*0.5)/12);        // vị trí dọc → tần số (y nhỏ = cao)\n  const master = ac.createGain(); master.gain.value = 0.2; master.connect(ac.destination);\n  const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 1400; lp.connect(master);\n  t.seg.forEach((sg,si)=>{\n    const osc = ac.createOscillator(); osc.type='sawtooth';\n    const g = ac.createGain(); osc.connect(g); g.connect(lp);\n    const a = X(sg[0][0]), b = X(sg[sg.length-1][0]);\n    osc.frequency.setValueAtTime(F(sg[0][1]), a);\n    sg.slice(1).forEach(p=>osc.frequency.linearRampToValueAtTime(F(p[1]), X(p[0])));\n    g.gain.setValueAtTime(0.0001, a); g.gain.linearRampToValueAtTime(1, a+0.03);\n    let hold = a+0.03;\n    if(t.creak==='start' && si===1){            // ngã: đầu đoạn sau bị \"đứt\" (giọng kẹt)\n      for(let k=0;k\u003c4;k++) g.gain.setValueAtTime(k%2 ? 1 : 0.12, hold + k*0.02);\n      hold += 0.08;\n    }\n    const endHold = Math.max(hold, b-0.06);\n    g.gain.setValueAtTime(1, endHold);\n    if(t.creak==='end'){ /* nặng: kết thúc đột ngột, giọng kẹt */\n      for(let k=0;k\u003c3;k++) g.gain.setValueAtTime(k%2 ? 1 : 0.15, endHold + k*0.02);\n    }\n    g.gain.linearRampToValueAtTime(0.0001, b);\n    osc.start(a); osc.stop(b+0.05);\n  });\n  return dur;\n}\n\n/* =========================================================\n   4. NHẬN DIỆN GIỌNG NÓI & CHẤM ĐIỂM\n   ========================================================= */\nconst SR = window.SpeechRecognition || window.webkitSpeechRecognition;\nlet activeRec = null, activeBtn = null;\n\nfunction errMsg(code){\n  switch(code){\n    case 'unsupported': return 'お使いのブラウザは音声認識に対応していません。Chrome または Edge をご利用ください。';\n    case 'not-allowed': case 'service-not-allowed': return 'マイクの使用が許可されていません。ブラウザの設定でマイクを許可してください。';\n    case 'no-speech': return '声が聞き取れませんでした。もう一度、はっきり話してください。';\n    case 'audio-capture': return 'マイクが見つかりません。接続を確認してください。';\n    case 'network': return 'ネットワークに接続できません。音声認識にはインターネットが必要です。';\n    default: return '音声認識でエラーが発生しました。もう一度お試しください。';\n  }\n}\nfunction listen(cb){\n  if(!SR){ setTimeout(()=>cb({error:'unsupported'}),0); return null; }\n  const r = new SR();\n  r.lang='vi-VN'; r.interimResults=false; r.maxAlternatives=5; r.continuous=false;\n  let result = null;\n  r.onresult = e => { result = {alts: Array.from(e.results[0]).map(a=>a.transcript)}; };\n  r.onerror  = e => { result = {error: e.error}; };\n  r.onend    = () => cb(result || {error:'no-speech'});\n  try{ r.start(); }catch(e){ setTimeout(()=>cb({error:'other'}),0); return null; }\n  return r;\n}\nfunction stopRec(){\n  if(activeRec){ try{ activeRec.abort(); }catch(e){} }\n  if(activeBtn){ activeBtn.classList.remove('listening'); }\n  activeRec = null; activeBtn = null;\n}\n// Bắt đầu thu âm cho 1 nút; done(kq) được gọi khi chấm xong, onErr(mã lỗi) khi lỗi\nfunction recordFor(btn, target, done, onErr){\n  if(activeBtn === btn){ stopRec(); return; }\n  stopRec();\n  if(hasTTS) speechSynthesis.cancel();\n  btn.classList.add('listening'); activeBtn = btn;\n  const rec = listen(res=>{\n    const mine = (activeRec === rec) || rec === null;\n    btn.classList.remove('listening');\n    if(!mine) return;\n    activeRec = null; activeBtn = null;\n    if(res.error){ if(res.error!=='aborted') onErr(res.error); return; }\n    done(evaluate(target, res.alts));\n  });\n  activeRec = rec;\n}\n\nconst norm = s => s.normalize('NFC').toLowerCase().replace(/[.,!?;:\"'“”‘’]/g,'').replace(/\\s+/g,' ').trim();\nconst strip = s => s.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/đ/g,'d');\nfunction lev(a,b){\n  const A=Array.from(a), B=Array.from(b); const dp=[];\n  for(let i=0;i\u003c=A.length;i++){ dp[i]=[i]; }\n  for(let j=1;j\u003c=B.length;j++) dp[0][j]=j;\n  for(let i=1;i\u003c=A.length;i++) for(let j=1;j\u003c=B.length;j++)\n    dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+(A[i-1]===B[j-1]?0:1));\n  return dp[A.length][B.length];\n}\nfunction evaluate(target, alts){\n  const t = norm(target); let best=0, heard=alts[0]||'';\n  alts.forEach(a=>{ const n=norm(a); const m=Math.max(t.length,n.length)||1; const s=1-lev(t,n)/m; if(s>best){best=s;heard=a;} });\n  const score = Math.round(best*100);\n  const toneOnly = score\u003c100 && strip(t)===strip(norm(heard));\n  return {score, heard, toneOnly, target};\n}\nfunction feedback(r){\n  if(r.score>=90) return {t:'素晴らしい！とても正確です。', c:'var(--good)'};\n  if(r.toneOnly) return {t:'惜しい！文字は合っていますが、声調（または母音の記号）が違います。', c:'var(--accent)'};\n  if(r.score>=70) return {t:'よくできました。もう少しで完璧です。', c:'var(--good)'};\n  if(r.score>=40) return {t:'もう少し。お手本をゆっくり聞いて、もう一度。', c:'var(--accent)'};\n  return {t:'もう一度挑戦しましょう。お手本をよく聞いてください。', c:'var(--bad)'};\n}\nfunction ringSVG(score,color){\n  const C=2*Math.PI*42;\n  return `\u003cdiv class=\"ring\">\u003csvg width=\"104\" height=\"104\" viewBox=\"0 0 104 104\">\n    \u003ccircle cx=\"52\" cy=\"52\" r=\"42\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"9\"/>\n    \u003ccircle cx=\"52\" cy=\"52\" r=\"42\" fill=\"none\" stroke=\"${color}\" stroke-width=\"9\" stroke-linecap=\"round\"\n      stroke-dasharray=\"${C}\" stroke-dashoffset=\"${C}\" style=\"transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)\" data-to=\"${C*(1-score/100)}\"/>\n    \u003c/svg>\u003cdiv class=\"num\" style=\"color:${color}\">${score}\u003csmall>点\u003c/small>\u003c/div>\u003c/div>`;\n}\nfunction animateRing(root){ requestAnimationFrame(()=>requestAnimationFrame(()=>{ $$('circle[data-to]',root).forEach(c=>c.style.strokeDashoffset=c.dataset.to); })); }\nfunction resultHTML(r){\n  const f = feedback(r), ok = r.score>=90;\n  return `\u003cdiv class=\"result-in\">${ringSVG(r.score,f.c)}\n    \u003cdiv>\u003cdiv class=\"fb-title\" style=\"color:${f.c}\">${f.t}\u003c/div>\n    \u003cdiv class=\"cmp\">\u003cspan class=\"chip\">お手本：${r.target}\u003c/span>\u003cspan class=\"chip ${ok?'ok':'ng'}\">認識結果：${r.heard||'（なし）'}\u003c/span>\u003c/div>\u003c/div>\u003c/div>`;\n}\n\n/* =========================================================\n   5. ĐIỀU HƯỚNG TAB\n   ========================================================= */\n// Phòng thu âm cần mật khẩu (kiểm tra ở phía trình duyệt; chỉ để ngăn học viên vô tình mở)\nconst STUDIO_PASSWORD = '112';\nlet studioUnlocked = false;\nfunction go(tab){\n  if(tab==='studio' && !studioUnlocked){ askStudioPassword(); return; }\n  if(tab==='studio' && !CAN_RECORD) return;\n  stopRec(); stopAllAudio();\n  if(tab!=='studio'){ stopStudioRec(); releaseRecStream(); }\n  $$('.tab').forEach(b=>{ const on=b.dataset.tab===tab; b.classList.toggle('active',on); b.setAttribute('aria-selected',on); });\n  $$('.panel').forEach(p=>p.classList.toggle('active', p.id==='tab-'+tab));\n  if(tab==='write') setTimeout(resizeCanvas,30);\n  window.scrollTo({top:0,behavior:'smooth'});\n}\n$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(b) go(b.dataset.tab); });\n\n/* =========================================================\n   6. MODULE: BẢNG CHỮ CÁI\n   ========================================================= */\nlet curLetter = 0, letterFilter = 'all';\nfunction renderGrid(){\n  const g = $('#letterGrid');\n  g.innerHTML = LETTERS.map((L,i)=>{\n    if(letterFilter!=='all' && L.type!==letterFilter) return '';\n    return `\u003cbutton class=\"lcard ${L.type==='v'?'v':''} ${state.letters.has(L.l)?'seen':''} ${i===curLetter?'sel':''}\" data-i=\"${i}\">\n      \u003cspan class=\"dot\">\u003c/span>\u003cdiv class=\"big\">${L.l}\u003c/div>\u003cdiv class=\"nm\">${L.say}\u003c/div>\u003cdiv class=\"kn\">${L.kana}\u003c/div>\u003c/button>`;\n  }).join('');\n}\nfunction renderDetail(){\n  const L = LETTERS[curLetter];\n  $('#detail').innerHTML = `\n    \u003cdiv class=\"glyph ${L.type==='v'?'v':''}\">${L.l}\u003c/div>\n    \u003cdiv>\n      \u003ch3>${L.l} \u003cspan style=\"font-size:15px;color:var(--muted)\">（${L.type==='v'?'母音':'子音'}）\u003c/span>\u003c/h3>\n      \u003cdiv class=\"kana\">名前：${L.say}　／　${L.kana}\u003c/div>\n      \u003cdiv class=\"tip\">${L.tip}\u003c/div>\n      \u003cdiv class=\"ex\">\u003cb>${L.w}\u003c/b>\u003cspan>${L.wk}\u003c/span>\u003cspan>${L.wj}\u003c/span>\u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cbutton class=\"btn primary\" data-a=\"name\">${ic('speaker')}文字の音\u003c/button>\n        \u003cbutton class=\"btn\" data-a=\"word\">${ic('speaker')}例語を聞く\u003c/button>\n        \u003cbutton class=\"btn\" data-a=\"slow\">${ic('slow')}ゆっくり\u003c/button>\n        \u003cbutton class=\"btn\" data-a=\"write\">${ic('pen')}書いて練習\u003c/button>\n        \u003cbutton class=\"btn\" data-a=\"check\">${ic('mic')}発音チェック\u003c/button>\n      \u003c/div>\n    \u003c/div>`;\n}\nfunction selectLetter(i, play=true){\n  curLetter = i; const L = LETTERS[i];\n  state.letters.add(L.l); saveState(); updateProgress();\n  renderDetail(); renderGrid();\n  if(play) speak(L.sp);\n}\n$('#letterGrid').addEventListener('click',e=>{ const c=e.target.closest('.lcard'); if(c) selectLetter(+c.dataset.i); });\n$('#letterFilter').addEventListener('click',e=>{\n  const b=e.target.closest('button'); if(!b) return;\n  letterFilter=b.dataset.f; $$('#letterFilter button').forEach(x=>x.classList.toggle('on',x===b)); renderGrid();\n});\n$('#detail').addEventListener('click',e=>{\n  const b=e.target.closest('[data-a]'); if(!b) return; const L=LETTERS[curLetter];\n  if(b.dataset.a==='name') speak(L.sp);\n  if(b.dataset.a==='word') speak(L.w);\n  if(b.dataset.a==='slow') speak(L.w,true);\n  if(b.dataset.a==='write'){ setWriteTarget('L:'+L.l); go('write'); }\n  if(b.dataset.a==='check'){ setCheck('letters',curLetter); go('check'); }\n});\n\n/* =========================================================\n   7. MODULE: THANH ĐIỆU\n   ========================================================= */\nfunction waveSVG(t){\n  const paths = t.seg.map(s=>`\u003cpolyline points=\"${s.map(p=>p.join(',')).join(' ')}\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>`).join('');\n  const dot = t.dot ? `\u003ccircle cx=\"${t.dot[0]}\" cy=\"${t.dot[1]}\" r=\"4.5\" fill=\"var(--accent)\"/>` : '';\n  const last = t.seg[t.seg.length-1].slice(-1)[0];\n  return `\u003csvg class=\"wave\" viewBox=\"0 0 100 60\">${paths}${dot}\u003ccircle cx=\"${last[0]}\" cy=\"${last[1]}\" r=\"4\" fill=\"var(--primary)\"/>\u003c/svg>`;\n}\nfunction renderTones(){\n  $('#toneGrid').innerHTML = TONES.map((t,i)=>`\n    \u003cdiv class=\"tone ${state.tones.has(t.n)?'seen':''}\" data-i=\"${i}\">\n      ${waveSVG(t)}\n      \u003cdiv>\u003cdiv class=\"t1\">${t.ex}\u003csmall>${t.n}（${t.mark}）\u003c/small>\u003c/div>\n      \u003cdiv class=\"t2\">${t.jp}\u003c/div>\u003cdiv class=\"t3\">意味：${t.m}\u003c/div>\u003cdiv class=\"t3\">${t.desc}\u003c/div>\n      \u003cdiv class=\"tbtns\">\u003cbutton class=\"btn small primary\" data-a=\"say\">${ic('speaker',16)}発音\u003c/button>\u003cbutton class=\"btn small\" data-a=\"mel\">${ic('wave',16)}ピッチ音\u003c/button>\u003c/div>\u003c/div>\n    \u003c/div>`).join('');\n}\nfunction markTone(t,el){ state.tones.add(t.n); saveState(); updateProgress(); if(el) el.classList.add('seen'); }\n$('#toneGrid').addEventListener('click',e=>{\n  const c=e.target.closest('.tone'); if(!c) return; const t=TONES[+c.dataset.i]; markTone(t,c);\n  const b=e.target.closest('[data-a]');\n  if(b && b.dataset.a==='mel') playMelody(t); else speak(t.ex);\n});\n$('#toneAll').addEventListener('click',()=>{ TONES.forEach(t=>state.tones.add(t.n)); saveState(); updateProgress(); renderTones(); speakSeq(TONES.map(t=>t.ex)); });\n$('#toneAllSlow').addEventListener('click',()=>{ speakSeq(TONES.map(t=>t.ex),true,800); });\n$('#toneAllMel').addEventListener('click',()=>{ TONES.forEach((t,i)=>setTimeout(()=>playMelody(t), i*1400)); });\n\n// ----- Luyện nghe cặp từ dễ nhầm -----\nlet curPair = PAIRS[0].id;\nfunction renderPairs(){\n  $('#pairSeg').innerHTML = PAIRS.map(g=>`\u003cbutton data-g=\"${g.id}\" class=\"${g.id===curPair?'on':''}\">${g.jp}\u003c/button>`).join('');\n  const g = PAIRS.find(x=>x.id===curPair);\n  $('#pairList').innerHTML = g.items.map((p,i)=>`\n    \u003cdiv class=\"pair\" data-i=\"${i}\">\n      \u003cbutton class=\"pbtn\" data-w=\"0\">\u003cb>${p[0]}\u003c/b>\u003csmall>${p[2]}・${p[1]}\u003c/small>\u003c/button>\n      \u003cbutton class=\"pbtn\" data-w=\"1\">\u003cb>${p[3]}\u003c/b>\u003csmall>${p[5]}・${p[4]}\u003c/small>\u003c/button>\n      \u003cbutton class=\"rbtn\" data-a=\"both\" aria-label=\"続けて聞く\">${ic('speaker')}\u003c/button>\n    \u003c/div>`).join('');\n}\n$('#pairSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; curPair=b.dataset.g; renderPairs(); });\n$('#pairList').addEventListener('click',e=>{\n  const row=e.target.closest('.pair'); if(!row) return;\n  const g=PAIRS.find(x=>x.id===curPair), p=g.items[+row.dataset.i];\n  const pb=e.target.closest('.pbtn');\n  if(pb) return speak(pb.dataset.w==='0'?p[0]:p[3]);\n  if(e.target.closest('[data-a=\"both\"]')) speakSeq([p[0],p[3]],false,900);\n});\n\n/* =========================================================\n   8. MODULE: KIỂM TRA PHÁT ÂM\n   ========================================================= */\nlet ckSrc = 'letters', ckIdx = 0, ckScores = [];\nfunction ckList(){\n  if(ckSrc==='letters') return LETTERS.map(l=>({vi:l.w, kana:l.wk, ja:l.wj}));\n  if(ckSrc==='tones'){\n    const base = TONES.map(t=>({vi:t.ex, kana:'', ja:t.n+'（'+t.mark+'）'}));\n    const pairs = []; PAIRS.forEach(g=>g.items.forEach(p=>{ pairs.push({vi:p[0],kana:'',ja:p[2]+'・'+p[1]}); pairs.push({vi:p[3],kana:'',ja:p[5]+'・'+p[4]}); }));\n    return base.concat(pairs);\n  }\n  if(ckSrc==='phrases') return ALLPHRASES.map(w=>({vi:w.vi, kana:w.kana, ja:w.ja}));\n  return ALLWORDS.map(w=>({vi:w.vi, kana:w.kana, ja:w.ja}));\n}\nfunction renderCheck(){\n  const list = ckList(); ckIdx = (ckIdx+list.length)%list.length; const t = list[ckIdx];\n  $('#ckVi').textContent = t.vi; $('#ckKana').textContent = t.kana; $('#ckJa').textContent = t.ja;\n  $('#ckResult').innerHTML = '';\n}\nfunction setCheck(src, idx){\n  ckSrc = src; ckIdx = idx;\n  $$('#checkSrc button').forEach(b=>b.classList.toggle('on', b.dataset.s===src)); renderCheck();\n}\n$('#checkSrc').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setCheck(b.dataset.s,0); });\n$('#ckPrev').addEventListener('click',()=>{ stopRec(); ckIdx--; renderCheck(); });\n$('#ckNext').addEventListener('click',()=>{ stopRec(); ckIdx++; renderCheck(); });\n$('#ckRand').addEventListener('click',()=>{ stopRec(); ckIdx=Math.floor(Math.random()*ckList().length); renderCheck(); });\n$('#ckPlay').addEventListener('click',()=>speak(ckList()[ckIdx].vi));\n$('#ckSlow').addEventListener('click',()=>speak(ckList()[ckIdx].vi,true));\n$('#ckMic').addEventListener('click',()=>{\n  const btn=$('#ckMic'), target=ckList()[ckIdx].vi;\n  $('#ckMicLabel').textContent='聞いています… もう一度押すと止まります'; $('#ckResult').innerHTML='';\n  recordFor(btn, target, r=>{\n    $('#ckMicLabel').textContent='マイクを押して、もう一度挑戦できます';\n    $('#ckResult').innerHTML = resultHTML(r); animateRing($('#ckResult'));\n    ckScores.push(r.score);\n    $('#ckCount').textContent = ckScores.length;\n    $('#ckAvg').textContent = Math.round(ckScores.reduce((a,b)=>a+b,0)/ckScores.length)+'点';\n  }, code=>{\n    $('#ckMicLabel').textContent='マイクを押して話してください';\n    $('#ckResult').innerHTML = `\u003cdiv class=\"err\">${errMsg(code)}\u003c/div>`;\n  });\n});\n\n/* =========================================================\n   9. MODULE: LUYỆN VIẾT (canvas)\n   ========================================================= */\nconst W = {canvas:null, ctx:null, strokes:[], cur:null, guide:true, target:'L:a'};\nfunction writeOptions(){\n  const letters = LETTERS.map(l=>`\u003coption value=\"L:${l.l}\">${l.l}\u003c/option>`).join('');\n  const tones = TONES.map(t=>`\u003coption value=\"T:${t.ex}\">${t.ex}（${t.n}）\u003c/option>`).join('');\n  $('#wTarget').innerHTML = `\u003coptgroup label=\"文字\">${letters}\u003c/optgroup>\u003coptgroup label=\"声調\">${tones}\u003c/optgroup>`;\n}\nfunction writeText(){\n  const [k,v] = W.target.split(':');\n  if(k==='L'){ const L=LETTERS.find(x=>x.l===v); return L.l; }\n  return v;\n}\nfunction writeSay(){\n  const [k,v] = W.target.split(':');\n  if(k==='L') return LETTERS.find(x=>x.l===v).sp; return v;\n}\nfunction setWriteTarget(val){\n  W.target = val; $('#wTarget').value = val; W.strokes = []; redraw();\n}\nfunction resizeCanvas(){\n  const c=W.canvas, r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;\n  if(!r.width) return;\n  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr); redraw();\n}\nfunction redraw(){\n  const c=W.canvas, x=W.ctx; if(!c) return; const w=c.width, h=c.height, dpr=window.devicePixelRatio||1;\n  const css = getComputedStyle(document.documentElement);\n  x.clearRect(0,0,w,h);\n  // Đường kẻ dòng\n  x.save(); x.strokeStyle=css.getPropertyValue('--line').trim(); x.lineWidth=1.5*dpr; x.setLineDash([8*dpr,8*dpr]);\n  [0.3,0.5,0.7].forEach(y=>{ x.beginPath(); x.moveTo(0,h*y); x.lineTo(w,h*y); x.stroke(); }); x.restore();\n  // Chữ mẫu\n  if(W.guide){\n    const txt=writeText(); x.save();\n    x.fillStyle = css.getPropertyValue('--primary').trim(); x.globalAlpha=0.16;\n    const size = h*(txt.length>1?0.5:0.7);\n    x.font = `${size}px Andika, 'Noto Sans', sans-serif`; x.textAlign='center'; x.textBaseline='middle';\n    x.fillText(txt, w/2, h/2+h*0.03); x.restore();\n  }\n  // Nét viết\n  x.strokeStyle = css.getPropertyValue('--ink').trim(); x.lineWidth=7*dpr; x.lineCap='round'; x.lineJoin='round';\n  W.strokes.forEach(s=>{\n    if(s.length===1){ x.beginPath(); x.arc(s[0].x*w,s[0].y*h,3.5*dpr,0,7); x.fillStyle=x.strokeStyle; x.fill(); return; }\n    x.beginPath(); s.forEach((p,i)=> i? x.lineTo(p.x*w,p.y*h) : x.moveTo(p.x*w,p.y*h)); x.stroke();\n  });\n}\nfunction wPos(e){ const r=W.canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height}; }\nfunction initWrite(){\n  W.canvas=$('#wCanvas'); W.ctx=W.canvas.getContext('2d'); writeOptions(); $('#wTarget').value=W.target;\n  const c=W.canvas;\n  c.addEventListener('pointerdown',e=>{ e.preventDefault(); c.setPointerCapture(e.pointerId); W.cur=[wPos(e)]; W.strokes.push(W.cur); redraw(); });\n  c.addEventListener('pointermove',e=>{ if(!W.cur) return; W.cur.push(wPos(e)); redraw(); });\n  const end=()=>{ W.cur=null; };\n  c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end); c.addEventListener('pointerleave',end);\n  window.addEventListener('resize',resizeCanvas);\n  resizeCanvas();\n}\n$('#wTarget').addEventListener('change',e=>setWriteTarget(e.target.value));\nfunction stepWrite(d){ const o=$$('#wTarget option'); let i=o.findIndex(x=>x.value===W.target); i=(i+d+o.length)%o.length; setWriteTarget(o[i].value); }\n$('#wPrev').addEventListener('click',()=>stepWrite(-1));\n$('#wNext').addEventListener('click',()=>stepWrite(1));\n$('#wMode').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; W.guide=b.dataset.m==='trace'; $$('#wMode button').forEach(x=>x.classList.toggle('on',x===b)); redraw(); });\n$('#wGuide').addEventListener('click',()=>{ W.guide=!W.guide; redraw(); });\n$('#wUndo').addEventListener('click',()=>{ W.strokes.pop(); redraw(); });\n$('#wClear').addEventListener('click',()=>{ W.strokes=[]; redraw(); });\n$('#wSay').addEventListener('click',()=>speak(writeSay()));\n\n/* =========================================================\n   10. MODULE: LUYỆN ĐỌC TỪ / CÂU (dùng chung cho từ vựng và câu giao tiếp)\n   ========================================================= */\nfunction makeStudyList(cfg){\n  let cur = cfg.groups[0].id;\n  const segEl=$(cfg.seg), listEl=$(cfg.list), countEl=$(cfg.count);\n  function renderSeg(){ segEl.innerHTML = cfg.groups.map(g=>`\u003cbutton data-t=\"${g.id}\" class=\"${g.id===cur?'on':''}\">${g.jp}\u003c/button>`).join(''); }\n  function render(){\n    const list = cfg.items.filter(w=>w.group===cur), done = list.filter(w=>cfg.done.has(w.id)).length;\n    countEl.textContent = `覚えた ${done} / ${list.length}`;\n    listEl.innerHTML = list.map(w=>`\n      \u003cdiv class=\"wrow ${cfg.cls} ${cfg.done.has(w.id)?'done':''}\" data-id=\"${w.id}\">\n        \u003cdiv>\u003cspan class=\"wv\">${w.vi}\u003c/span>\u003cdiv class=\"wk2\">${w.kana}\u003c/div>\u003cdiv class=\"wj\">${w.ja}\u003c/div>\u003cdiv class=\"wres\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"wbtns\">\n          \u003cbutton class=\"rbtn\" data-a=\"play\" aria-label=\"聞く\">${ic('speaker')}\u003c/button>\n          \u003cbutton class=\"rbtn\" data-a=\"slow\" aria-label=\"ゆっくり聞く\">${ic('slow')}\u003c/button>\n          \u003cbutton class=\"rbtn\" data-a=\"rec\" aria-label=\"まねして読む\">${ic('mic')}\u003c/button>\n          \u003cbutton class=\"rbtn ${cfg.done.has(w.id)?'on':''}\" data-a=\"done\" aria-label=\"覚えた\">${ic('check')}\u003c/button>\n        \u003c/div>\n      \u003c/div>`).join('');\n  }\n  segEl.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; stopRec(); cur=b.dataset.t; renderSeg(); render(); });\n  listEl.addEventListener('click',e=>{\n    const b=e.target.closest('[data-a]'); if(!b) return;\n    const row=b.closest('.wrow'), w=cfg.items.find(x=>x.id===row.dataset.id), res=$('.wres',row);\n    if(b.dataset.a==='play') speak(w.vi);\n    if(b.dataset.a==='slow') speak(w.vi,true);\n    if(b.dataset.a==='done'){\n      if(cfg.done.has(w.id)) cfg.done.delete(w.id); else cfg.done.add(w.id);\n      saveState(); updateProgress(); render();\n    }\n    if(b.dataset.a==='rec'){\n      res.textContent='';\n      recordFor(b, w.vi, r=>{\n        const f=feedback(r); res.style.color=f.c; res.textContent=`${r.score}点　認識結果：${r.heard||'（なし）'}　${r.toneOnly?'（声調に注意）':''}`;\n      }, code=>{ res.style.color='var(--bad)'; res.textContent=errMsg(code); });\n    }\n  });\n  renderSeg(); render();\n}\n\n/* =========================================================\n   11. MODULE: TRẮC NGHIỆM\n   ========================================================= */\nconst QMODES = [\n  {id:'listen', t:'音を聞いて文字を選ぶ', d:'聞こえた音に合う文字を選びます。'},\n  {id:'see',    t:'文字を見て読み方を選ぶ', d:'文字の名前の読み方（カタカナ）を選びます。'},\n  {id:'tone',   t:'音を聞いて声調を選ぶ', d:'聞こえた「ma」の声調を当てます。'},\n  {id:'pair',   t:'似た声調を聞き分ける', d:'nghỉ / nghĩ など、声調だけが違う2語のどちらかを当てます。'},\n  {id:'mix',    t:'ミックス（10問）', d:'4種類の問題がランダムで出ます。'},\n];\nconst quiz = {mode:null, qs:[], i:0, score:0, wrong:[], answered:false};\n\nfunction makeQ(kind){\n  if(kind==='listen'){\n    const t=pick(LETTERS), opts=shuffle([t,...sample(LETTERS.filter(x=>x!==t),3)]);\n    return {kind, prompt:'音を聞いて、正しい文字を選びましょう。', play:t.sp, show:'', opts:opts.map(o=>({label:o.l, val:o.l})), ans:t.l, tag:'L:'+t.l, expl:`正解は ${t.l}（${t.say}）です。`};\n  }\n  if(kind==='see'){\n    const t=pick(LETTERS), pool=LETTERS.filter(x=>x!==t && x.kana!==t.kana);\n    const opts=shuffle([t,...sample(pool,3)]);\n    return {kind, prompt:'この文字の名前の読み方を選びましょう。', play:null, show:t.l, opts:opts.map(o=>({label:o.kana, val:o.kana})), ans:t.kana, tag:'L:'+t.l, expl:`${t.l} は「${t.kana}」（${t.say}）です。`};\n  }\n  if(kind==='pair'){\n    const g=pick(PAIRS), p=pick(g.items), idx=Math.random()\u003c0.5?0:1;\n    const w=[p[0],p[3]], ja=[p[1],p[4]], tn=[p[2],p[5]];\n    return {kind, prompt:'聞こえたのは、どちらの単語でしょう？', play:w[idx], show:'', opts:shuffle([0,1]).map(i=>({label:w[i], sub:ja[i], val:w[i]})), ans:w[idx], tag:'P:'+w[idx],\n      expl:`${w[idx]}（${tn[idx]}）＝ ${ja[idx]}。もう一方は ${w[1-idx]}（${tn[1-idx]}）＝ ${ja[1-idx]} です。`};\n  }\n  const t=pick(TONES);\n  return {kind:'tone', prompt:'音を聞いて、声調を選びましょう。', play:t.ex, show:'', opts:TONES.map(o=>({label:o.mark, sub:o.n, val:o.n})), ans:t.n, tag:'T:'+t.n, expl:`${t.ex}（${t.n}）＝ ${t.m}。${t.desc}`};\n}\nfunction renderQuizHome(){\n  quiz.mode=null;\n  $('#quizBox').innerHTML = `\u003cp class=\"lead\">学んだことを確認しましょう。1回10問です。（自己ベスト：${state.best} / 10）\u003c/p>\n    \u003cdiv class=\"modes\">${QMODES.map(m=>`\u003cbutton class=\"mode\" data-m=\"${m.id}\">\u003cb>${m.t}\u003c/b>\u003cspan>${m.d}\u003c/span>\u003c/button>`).join('')}\u003c/div>`;\n}\nfunction startQuiz(mode){\n  quiz.mode=mode; quiz.i=0; quiz.score=0; quiz.wrong=[]; quiz.answered=false;\n  const kinds = mode==='mix' ? ['listen','see','tone','pair'] : [mode];\n  quiz.qs = Array.from({length:10},(_,i)=>makeQ(kinds[i%kinds.length]));\n  if(mode==='mix') quiz.qs=shuffle(quiz.qs);\n  renderQ();\n}\nfunction renderQ(){\n  const q=quiz.qs[quiz.i]; quiz.answered=false;\n  $('#quizBox').innerHTML = `\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"qhead\">\u003cspan>第 ${quiz.i+1} 問 / 10\u003c/span>\u003cspan>正解 ${quiz.score}\u003c/span>\u003c/div>\n      \u003cdiv class=\"qbar\">\u003ci style=\"width:${quiz.i/10*100}%\">\u003c/i>\u003c/div>\n      \u003cdiv class=\"qprompt\">${q.prompt}\u003c/div>\n      ${q.show?`\u003cdiv class=\"qshow\">${q.show}\u003c/div>`:''}\n      ${q.play?`\u003cdiv class=\"row\" style=\"justify-content:center;margin-bottom:14px\">\u003cbutton class=\"btn primary\" id=\"qPlay\">${ic('speaker')}もう一度聞く\u003c/button>\u003cbutton class=\"btn\" id=\"qSlow\">${ic('slow')}ゆっくり\u003c/button>\u003c/div>`:''}\n      \u003cdiv class=\"opts\" style=\"${q.opts.length===6?'grid-template-columns:repeat(3,1fr)':''}\">\n        ${q.opts.map(o=>`\u003cbutton class=\"opt\" data-v=\"${o.val}\">${o.label}${o.sub?`\u003csmall>${o.sub}\u003c/small>`:''}\u003c/button>`).join('')}\n      \u003c/div>\n      \u003cdiv class=\"qfb\" id=\"qFb\">\u003c/div>\n    \u003c/div>`;\n  if(q.play) setTimeout(()=>speak(q.play),250);\n}\nfunction answerQ(btn){\n  if(quiz.answered) return; quiz.answered=true;\n  const q=quiz.qs[quiz.i], ok = btn.dataset.v===q.ans;\n  $$('.opt').forEach(o=>{ o.disabled=true; if(o.dataset.v===q.ans) o.classList.add('ok'); });\n  if(ok) quiz.score++; else { btn.classList.add('ng'); quiz.wrong.push(q.tag); }\n  const last = quiz.i===9;\n  $('#qFb').innerHTML = `\u003cdiv style=\"font-weight:700;color:${ok?'var(--good)':'var(--bad)'}\">${ok?'正解！':'残念…'}\u003c/div>\n    \u003cdiv style=\"font-size:13.5px;color:var(--muted);margin:4px 0 10px\">${q.expl}\u003c/div>\n    \u003cbutton class=\"btn accent\" id=\"qNext\">${last?'結果を見る':'次の問題へ'}\u003c/button>`;\n}\nfunction endQuiz(){\n  if(quiz.score>state.best){ state.best=quiz.score; }\n  saveState(); updateProgress();\n  const msg = quiz.score>=9?'素晴らしい！ほぼ完璧です。':quiz.score>=7?'よくできました！':quiz.score>=5?'あと少し。復習すればもっと伸びます。':'もう一度、文字表と声調を復習しましょう。';\n  const color = quiz.score>=7?'var(--good)':quiz.score>=5?'var(--accent)':'var(--bad)';\n  const weak=[...new Set(quiz.wrong)];\n  const chips = weak.map(t=>{ const v=t.split(':')[1]; return `\u003cbutton data-w=\"${t}\">${v}\u003c/button>`; }).join('');\n  $('#quizBox').innerHTML = `\u003cdiv class=\"card\" style=\"text-align:center\">\n    \u003cdiv style=\"display:flex;justify-content:center\">${ringSVG(quiz.score*10,color)}\u003c/div>\n    \u003cdiv class=\"fb-title\" style=\"margin-top:10px\">${quiz.score} / 10 問正解\u003c/div>\n    \u003cdiv style=\"color:var(--muted);margin-top:4px\">${msg}\u003c/div>\n    ${weak.length?`\u003cdiv style=\"margin-top:16px;font-size:13.5px\">間違えた項目（タップして復習）\u003c/div>\u003cdiv class=\"weak\">${chips}\u003c/div>`:''}\n    \u003cdiv class=\"row\" style=\"justify-content:center;margin-top:18px\">\n      \u003cbutton class=\"btn accent\" id=\"qAgain\">もう一度\u003c/button>\u003cbutton class=\"btn\" id=\"qHome\">メニューに戻る\u003c/button>\n    \u003c/div>\u003c/div>`;\n  animateRing($('#quizBox'));\n}\n$('#quizBox').addEventListener('click',e=>{\n  const m=e.target.closest('.mode'); if(m) return startQuiz(m.dataset.m);\n  const o=e.target.closest('.opt'); if(o) return answerQ(o);\n  if(e.target.closest('#qPlay')) return speak(quiz.qs[quiz.i].play);\n  if(e.target.closest('#qSlow')) return speak(quiz.qs[quiz.i].play,true);\n  if(e.target.closest('#qNext')){ if(quiz.i>=9) endQuiz(); else { quiz.i++; renderQ(); } return; }\n  if(e.target.closest('#qAgain')) return startQuiz(quiz.mode);\n  if(e.target.closest('#qHome')) return renderQuizHome();\n  const w=e.target.closest('[data-w]');\n  if(w){ const [k,v]=w.dataset.w.split(':'); if(k==='L'){ go('letters'); selectLetter(LETTERS.findIndex(x=>x.l===v)); } else { go('tones'); } }\n});\n\n/* =========================================================\n   11B. MODULE: THU ÂM GIỌNG THẬT (lưu trong IndexedDB của trình duyệt)\n   ========================================================= */\nconst RecDB = {\n  db:null, name: BRIDGE ? 'cloud' : 'rec',\n  open(){ return new Promise(res=>{ try{\n    const r = indexedDB.open('vnapp_voice',2);\n    r.onupgradeneeded = () => { ['rec','cloud'].forEach(n=>{ if(!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); }); };\n    r.onsuccess = () => { this.db = r.result; res(true); };\n    r.onerror = () => res(false); r.onblocked = () => res(false);\n  }catch(e){ res(false); } }); },\n  store(mode){ return this.db.transaction(this.name,mode).objectStore(this.name); },\n  all(){ return new Promise(res=>{ const out=[]; if(!this.db) return res(out); try{\n    const rq = this.store('readonly').openCursor();\n    rq.onsuccess = () => { const c = rq.result; if(c){ out.push([c.key,c.value]); c.continue(); } else res(out); };\n    rq.onerror = () => res(out);\n  }catch(e){ res(out); } }); },\n  put(k,v){ return new Promise(res=>{ if(!this.db) return res(false); try{ const rq=this.store('readwrite').put(v,k); rq.onsuccess=()=>res(true); rq.onerror=()=>res(false); }catch(e){ res(false); } }); },\n  del(k){ return new Promise(res=>{ if(!this.db) return res(false); try{ const rq=this.store('readwrite').delete(k); rq.onsuccess=()=>res(true); rq.onerror=()=>res(false); }catch(e){ res(false); } }); },\n  clear(){ return new Promise(res=>{ if(!this.db) return res(false); try{ const rq=this.store('readwrite').clear(); rq.onsuccess=()=>res(true); rq.onerror=()=>res(false); }catch(e){ res(false); } }); }\n};\n\nconst STUDIO_GROUPS = [\n  {id:'all',jp:'すべて'},{id:'todo',jp:'未録音のみ'},{id:'letters',jp:'文字の名前'},{id:'tones',jp:'声調'},\n  {id:'pairs',jp:'聞き分け'},{id:'examples',jp:'文字の例語'},{id:'words',jp:'単語'},{id:'phrases',jp:'会話'}];\nlet studioItems = [], studioGroup = 'all', recState = null, recStream = null, recAC = null, recMeter = null, meterRAF = 0;\n\nfunction buildStudioItems(){\n  const seen = new Set(), out = [];\n  const add = (g,text,ja) => { if(seen.has(text)) return; seen.add(text); out.push({g,text,ja}); };\n  LETTERS.forEach(L => add('letters', L.sp, '文字の名前：'+L.l+'（'+L.kana+'）'));\n  TONES.forEach(t => add('tones', t.ex, t.n+'（'+t.mark+'）'));\n  PAIRS.forEach(g => g.items.forEach(p => { add('pairs',p[0],p[2]+'・'+p[1]); add('pairs',p[3],p[5]+'・'+p[4]); }));\n  LETTERS.forEach(L => add('examples', L.w, L.wj));\n  ALLWORDS.forEach(w => add('words', w.vi, w.ja));\n  ALLPHRASES.forEach(p => add('phrases', p.vi, p.ja));\n  return out;\n}\nfunction studioMsg(t, kind){\n  const el = $('#studioMsg'); el.textContent = t || ''; el.className = 'studio-msg' + (kind ? ' '+kind : ''); el.style.display = t ? 'block' : 'none';\n}\nfunction recSupported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }\nfunction pickMime(){\n  if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';\n  return ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t)) || '';\n}\nasync function getRecStream(){\n  if(recStream && recStream.getTracks().some(t=>t.readyState==='live')) return recStream;\n  recStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:true, autoGainControl:true}});\n  return recStream;\n}\nfunction releaseRecStream(){\n  stopMeter();\n  if(recStream){ recStream.getTracks().forEach(t=>t.stop()); recStream = null; }\n  if(recAC){ try{ recAC.close(); }catch(e){} recAC = null; }\n}\n// Đo âm lượng khi thu: hiển thị thanh mức và phát hiện micro không có tiếng\nfunction startMeter(st){\n  try{\n    const AC = window.AudioContext || window.webkitAudioContext; if(!AC || !recStream) return;\n    if(!recAC) recAC = new AC(); if(recAC.state==='suspended') recAC.resume();\n    const src = recAC.createMediaStreamSource(recStream), an = recAC.createAnalyser(); an.fftSize = 1024; src.connect(an);\n    const buf = new Uint8Array(an.fftSize); recMeter = {src}; st.metered = true;\n    const tick = () => {\n      if(recState!==st) return;\n      an.getByteTimeDomainData(buf); let m = 0;\n      for(let i=0;i\u003cbuf.length;i++){ const v = Math.abs(buf[i]-128)/128; if(v>m) m = v; }\n      st.peak = Math.max(st.peak, m);\n      const bar = $('.srow.rec .smeter i'); if(bar) bar.style.width = Math.min(100, m*140)+'%';\n      meterRAF = requestAnimationFrame(tick);\n    };\n    tick();\n  }catch(e){}\n}\nfunction stopMeter(){ cancelAnimationFrame(meterRAF); if(recMeter){ try{ recMeter.src.disconnect(); }catch(e){} recMeter = null; } }\n\n// ----- Đồng bộ giọng thu với Firestore (qua cầu nối của trang chủ) -----\nfunction b64ToBlob(b64, mime){ const bin = atob(b64), u = new Uint8Array(bin.length); for(let i=0;i\u003cbin.length;i++) u[i] = bin.charCodeAt(i); return new Blob([u],{type:mime}); }\nlet cloudStatus = 'idle';   // idle | syncing | ok | error\nasync function cloudSync(){\n  if(!BRIDGE) return true;\n  cloudStatus = 'syncing';\n  const last = +store.get('lastsync',0) || 0;\n  const since = REC.size ? Math.max(0, last - 600000) : 0;   // chồng lấn 10 phút để không sót thay đổi\n  let docs;\n  try{ docs = await BRIDGE.fetchSince(since); }catch(e){ cloudStatus = 'error'; return false; }\n  let maxTs = last;\n  for(const d of (docs||[])){\n    if(!d || typeof d.text!=='string') continue;\n    maxTs = Math.max(maxTs, d.ts||0);\n    if(d.deleted){ REC.delete(d.text); await RecDB.del(d.text); continue; }\n    if(!d.data || !/^audio\\//.test(d.mime||'')) continue;\n    try{ const rec = {blob:b64ToBlob(d.data,d.mime), mime:d.mime, ts:d.ts||0, dur:d.dur||0}; REC.set(d.text,rec); await RecDB.put(d.text,rec); }catch(e){}\n  }\n  store.set('lastsync', maxTs); cloudStatus = 'ok'; return true;\n}\nasync function cloudPut(text, rec){\n  const d = await readAs(rec.blob,'url'), b64 = String(d).split(',')[1] || '';\n  if(b64.length > 900000) throw new Error('too-big');\n  await BRIDGE.put(text, {mime:rec.mime, dur:rec.dur||0, ts:rec.ts||Date.now(), data:b64});\n}\nfunction setRecLabel(){\n  const done = studioItems.filter(it=>REC.has(it.text)).length, total = studioItems.length;\n  const head = CAN_RECORD ? '録音済み ' : '先生の音声 ';\n  $('#recCount').textContent = cloudStatus==='syncing' ? (CAN_RECORD ? '同期中…' : '先生の音声を読み込み中…')\n    : cloudStatus==='error' ? (head + done + ' / ' + total + '（最新の音声を取得できませんでした）') : (head + done + ' / ' + total);\n}\n\nfunction rowHTML(it,i){\n  const r = REC.get(it.text), on = recState && recState.i===i;\n  return `\u003cdiv class=\"srow ${r?'has':''} ${on?'rec':''}\" data-i=\"${i}\">\n    \u003cdiv class=\"sinfo\">\u003cdiv class=\"sv\">${it.text}\u003c/div>\u003cdiv class=\"sj\">${it.ja}\u003c/div>\u003cdiv class=\"smeter\">\u003ci>\u003c/i>\u003c/div>\u003c/div>\n    \u003cdiv class=\"schip\">${on?'録音中…':r?('録音済み'+(r.dur?' '+r.dur.toFixed(1)+'秒':'')):'未録音'}\u003c/div>\n    \u003cdiv class=\"sbtns\">\n      \u003cbutton class=\"rbtn ${on?'listening':''}\" data-a=\"rec\" aria-label=\"${on?'録音を止める':'録音する'}\">${ic(on?'stop':'mic')}\u003c/button>\n      \u003cbutton class=\"rbtn\" data-a=\"play\" aria-label=\"再生\">${ic('speaker')}\u003c/button>\n      \u003cbutton class=\"rbtn\" data-a=\"del\" aria-label=\"録音を削除\" ${r?'':'disabled'}>${ic('trash')}\u003c/button>\n    \u003c/div>\u003c/div>`;\n}\nfunction renderStudioSeg(){\n  $('#studioSeg').innerHTML = STUDIO_GROUPS.map(g=>`\u003cbutton data-g=\"${g.id}\" class=\"${g.id===studioGroup?'on':''}\">${g.jp}\u003c/button>`).join('');\n}\nfunction renderStudioList(){\n  const list = studioItems.map((it,i)=>({it,i})).filter(({it}) => studioGroup==='all' ? true : studioGroup==='todo' ? !REC.has(it.text) : it.g===studioGroup);\n  $('#studioList').innerHTML = list.length ? list.map(({it,i})=>rowHTML(it,i)).join('') : '\u003cdiv class=\"studio-msg ok\" style=\"display:block\">このグループはすべて録音済みです。\u003c/div>';\n}\nfunction updateStudioRow(i){\n  const row = $('.srow[data-i=\"'+i+'\"]'); if(!row) return;\n  const t = document.createElement('div'); t.innerHTML = rowHTML(studioItems[i], i); row.replaceWith(t.firstElementChild);\n}\nfunction updateStudioProgress(){\n  const done = studioItems.filter(it=>REC.has(it.text)).length, total = studioItems.length;\n  $('#studioFill').style.width = (total ? done/total*100 : 0)+'%';\n  $('#studioCount').textContent = done+' / '+total;\n  setRecLabel();\n}\n\nasync function startRec(i){\n  if(!studioUnlocked) return;\n  if(!CAN_RECORD) return;\n  if(!recSupported()){ studioMsg('お使いのブラウザは録音に対応していません。Chrome・Edge・Safari の最新版をご利用ください。','err'); return; }\n  stopAllAudio(); stopRec();\n  if(recState) await stopStudioRec();\n  try{ await getRecStream(); }catch(e){\n    studioMsg(e && /NotFound|Devices/i.test(e.name||'') ? 'マイクが見つかりません。接続を確認してください。' : 'マイクの使用が許可されていません。アドレスバー付近の表示から、マイクを許可してください。','err'); return;\n  }\n  studioMsg('');\n  const mime = pickMime(); let mr;\n  try{\n    const opt = {audioBitsPerSecond:48000}; if(mime) opt.mimeType = mime;\n    try{ mr = new MediaRecorder(recStream, opt); }catch(e1){ mr = mime ? new MediaRecorder(recStream,{mimeType:mime}) : new MediaRecorder(recStream); }\n  }catch(e){ studioMsg('この端末では録音を開始できませんでした。','err'); return; }\n  const st = {i, mr, chunks:[], t0:performance.now(), peak:0, metered:false, mime:mr.mimeType||mime||'audio/webm', timer:0, done:null};\n  st.done = new Promise(res=>{ mr.onstop = () => res(); });\n  mr.ondataavailable = e => { if(e.data && e.data.size) st.chunks.push(e.data); };\n  recState = st; mr.start(); startMeter(st);\n  st.timer = setTimeout(()=>{ if(recState===st) stopStudioRec(); }, 8000);\n  updateStudioRow(i);\n}\nasync function stopStudioRec(){\n  const st = recState; if(!st) return;\n  recState = null; clearTimeout(st.timer); stopMeter();\n  try{ if(st.mr.state!=='inactive') st.mr.stop(); }catch(e){}\n  await st.done;\n  const dur = (performance.now()-st.t0)/1000, it = studioItems[st.i];\n  updateStudioRow(st.i);\n  if(dur\u003c0.3 || !st.chunks.length){ studioMsg('録音が短すぎます。録音ボタンを押してから話してください。','err'); return; }\n  if(st.metered && st.peak\u003c0.01){ studioMsg('音がほとんど入っていません。マイクの設定や音量を確認してください。','err'); return; }\n  const rec = {blob:new Blob(st.chunks,{type:st.mime}), mime:st.mime, ts:Date.now(), dur};\n  REC.set(it.text, rec);\n  const saved = await RecDB.put(it.text, rec);\n  let cloudErr = '';\n  if(BRIDGE){\n    try{ await cloudPut(it.text, rec); }\n    catch(e){ cloudErr = (e && e.message==='too-big') ? '録音が長すぎてクラウドに保存できません。短く録り直してください。' : 'クラウドへの保存に失敗しました。管理者の権限（Firestore の規則）とネットワークを確認してください。この端末にだけ保存されています。'; }\n  }\n  if(cloudErr) studioMsg(cloudErr,'err');\n  else if(BRIDGE && st.metered && st.peak\u003c0.06) studioMsg('クラウドに保存しました。ただし音が小さめです。マイクに少し近づけて録り直すと、より聞き取りやすくなります。','warn');\n  else if(BRIDGE) studioMsg('クラウドに保存しました。すべての学習者がこの声で聞けます。','ok');\n  else if(!saved) studioMsg('録音しました。ただし、この環境では保存領域が使えないため、ページを閉じると消えます。「バックアップを保存」で書き出してください。','warn');\n  else if(st.metered && st.peak\u003c0.06) studioMsg('保存しました。ただし音が小さめです。マイクに少し近づけて録り直すと、より聞き取りやすくなります。','warn');\n  else studioMsg('保存しました。','ok');\n  updateStudioRow(st.i); updateStudioProgress();\n  playRecorded(it.text,false);   // 録音直後に聞いて確認できる\n}\nasync function deleteRec(i){\n  if(!CAN_RECORD) return;\n  const it = studioItems[i];\n  if(BRIDGE){ try{ await BRIDGE.del(it.text); }catch(e){ studioMsg('クラウドから削除できませんでした。管理者の権限とネットワークを確認してください。','err'); return; } }\n  REC.delete(it.text); await RecDB.del(it.text);\n  stopAllAudio(); updateStudioRow(i); updateStudioProgress(); studioMsg('削除しました。','ok');\n}\nfunction nextTodo(){\n  const idx = studioItems.findIndex(it=>!REC.has(it.text));\n  if(idx\u003c0){ studioMsg('すべて録音済みです。お疲れさまでした！','ok'); return; }\n  if(studioGroup!=='all' && studioItems[idx].g!==studioGroup){ studioGroup = 'all'; renderStudioSeg(); renderStudioList(); }\n  const row = $('.srow[data-i=\"'+idx+'\"]'); if(!row) return;\n  row.scrollIntoView({block:'center', behavior:'smooth'}); row.classList.add('flash'); setTimeout(()=>row.classList.remove('flash'),1600);\n}\n\n// ----- Sao lưu / khôi phục (JSON) -----\nfunction readAs(file, mode){\n  return new Promise((res,rej)=>{ const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); mode==='text' ? fr.readAsText(file) : fr.readAsDataURL(file); });\n}\nasync function exportBackup(){\n  if(!REC.size){ studioMsg('まだ録音がありません。','warn'); return; }\n  const items = {};\n  for(const [k,v] of REC){ const d = await readAs(v.blob,'url'); items[k] = {mime:v.mime, ts:v.ts, dur:v.dur||0, data:String(d).split(',')[1]||''}; }\n  const blob = new Blob([JSON.stringify({app:'vnapp', version:1, items})], {type:'application/json'});\n  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'vietnamese_voice_backup.json';\n  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);\n  studioMsg('バックアップを書き出しました（'+REC.size+'件）。別の端末では「バックアップを読み込む」で取り込めます。','ok');\n}\nasync function importBackup(file){\n  if(!CAN_RECORD) return;\n  try{\n    const data = JSON.parse(await readAs(file,'text'));\n    if(!data || data.app!=='vnapp' || !data.items) throw new Error('format');\n    let n = 0, failed = 0;\n    for(const [k,v] of Object.entries(data.items)){\n      if(!v || !v.data || typeof v.mime!=='string' || !/^audio\\//.test(v.mime)) continue;\n      const bin = atob(v.data), u = new Uint8Array(bin.length);\n      for(let j=0;j\u003cbin.length;j++) u[j] = bin.charCodeAt(j);\n      const rec = {blob:new Blob([u],{type:v.mime}), mime:v.mime, ts:v.ts||Date.now(), dur:v.dur||0};\n      if(BRIDGE){ try{ await cloudPut(k,rec); }catch(e){ failed++; continue; } }\n      REC.set(k,rec); await RecDB.put(k,rec); n++;\n    }\n    renderStudioList(); updateStudioProgress();\n    studioMsg(n+'件の録音を読み込みました。'+(BRIDGE?'（クラウドに保存済み）':'')+(failed?' '+failed+'件はクラウドに保存できませんでした。':''), failed?'warn':'ok');\n  }catch(e){ studioMsg('バックアップファイルを読み込めませんでした。このアプリで書き出したファイルを選んでください。','err'); }\n}\n\n$('#studioBtn').addEventListener('click',()=>go('studio'));\n$('#voiceStudio').addEventListener('click',()=>go('studio'));\n$('#useRec').checked = useRec;\n$('#useRec').addEventListener('change',e=>{ useRec = e.target.checked; store.set('userec',useRec); });\n$('#studioSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; studioGroup=b.dataset.g; renderStudioSeg(); renderStudioList(); });\n$('#studioList').addEventListener('click',async e=>{\n  const b = e.target.closest('[data-a]'); if(!b) return;\n  const row = b.closest('.srow'), i = +row.dataset.i, it = studioItems[i];\n  if(b.dataset.a==='rec'){ if(recState && recState.i===i) await stopStudioRec(); else await startRec(i); }\n  if(b.dataset.a==='play'){ stopAllAudio(); if(REC.has(it.text)) playRecorded(it.text); else speak(it.text); }\n  if(b.dataset.a==='del') deleteRec(i);\n});\n$('#studioNext').addEventListener('click',nextTodo);\n$('#studioExport').addEventListener('click',exportBackup);\n$('#studioImport').addEventListener('click',()=>$('#importFile').click());\n$('#importFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) importBackup(f); e.target.value=''; });\n$('#studioClear').addEventListener('click',async()=>{\n  if(!CAN_RECORD || !REC.size) return;\n  if(!confirm(BRIDGE ? 'クラウドに保存された録音をすべて削除します。すべての学習者の音声も消えます。よろしいですか？（先にバックアップを保存することをおすすめします）' : '保存した録音をすべて削除します。よろしいですか？（先にバックアップを保存することをおすすめします）')) return;\n  if(BRIDGE){\n    let failed = 0;\n    for(const k of [...REC.keys()]){ try{ await BRIDGE.del(k); }catch(e){ failed++; } }\n    if(failed){ studioMsg(failed+'件を削除できませんでした。管理者の権限とネットワークを確認してください。','err'); await cloudSync(); renderStudioList(); updateStudioProgress(); return; }\n  }\n  REC.clear(); await RecDB.clear(); renderStudioList(); updateStudioProgress(); studioMsg('すべて削除しました。','ok');\n});\nfunction askStudioPassword(){\n  const m = $('#pwModal'); m.classList.add('show'); $('#pwErr').textContent = '';\n  const inp = $('#pwInput'); inp.value = ''; setTimeout(()=>inp.focus(), 50);\n}\nfunction closeStudioPassword(){ $('#pwModal').classList.remove('show'); $('#pwInput').value = ''; }\nfunction submitStudioPassword(){\n  if($('#pwInput').value.trim() === STUDIO_PASSWORD){ studioUnlocked = true; closeStudioPassword(); go('studio'); }\n  else { $('#pwErr').textContent = 'パスワードが違います。もう一度入力してください。'; $('#pwInput').value = ''; $('#pwInput').focus(); }\n}\n$('#pwOk').addEventListener('click', submitStudioPassword);\n$('#pwCancel').addEventListener('click', closeStudioPassword);\n$('#pwInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submitStudioPassword(); if(e.key==='Escape') closeStudioPassword(); });\n$('#pwModal').addEventListener('click', e=>{ if(e.target.id==='pwModal') closeStudioPassword(); });\nasync function initStudio(){\n  studioItems = buildStudioItems();\n  const ok = await RecDB.open();\n  if(ok){ (await RecDB.all()).forEach(([k,v])=>{ if(v && v.blob) REC.set(k,v); }); }\n  if(!CAN_RECORD){                     // Người học: không có phòng thu, chỉ nghe\n    $('#studioBtn').style.display = 'none'; $('#voiceStudio').style.display = 'none';\n    $('#voiceNote').textContent = '声が不自然なときは、別の音声を選んでください。';\n  }\n  if(BRIDGE){ $('#studioCloudNote').style.display = CAN_RECORD ? 'list-item' : 'none'; $('#studioLocalNote').style.display = 'none'; cloudStatus = 'syncing'; }\n  renderStudioSeg(); renderStudioList(); updateStudioProgress();\n  if(!recSupported()) $('#studioSupport').style.display = 'block';\n  if(BRIDGE){ await cloudSync(); renderStudioList(); updateStudioProgress(); }\n  if(!ok && !BRIDGE) studioMsg('このブラウザでは録音の保存領域が使えません。録音後は必ず「バックアップを保存」で書き出してください。','warn');\n}\n\n/* =========================================================\n   12. KHỞI TẠO\n   ========================================================= */\nfunction applyTheme(){\n  document.documentElement.setAttribute('data-theme', state.theme);\n  $('#themeBtn').innerHTML = ic(state.theme==='dark'?'sun':'moon', 20);\n  redraw();\n}\n$('#themeBtn').addEventListener('click',()=>{ state.theme = state.theme==='dark'?'light':'dark'; saveState(); applyTheme(); });\n$('#noticeClose').addEventListener('click',()=>$('#voiceNotice').classList.remove('show'));\ndocument.addEventListener('visibilitychange',()=>{ if(document.hidden){ stopRec(); stopAllAudio(); stopStudioRec(); } else if(BRIDGE && recState===null){ cloudSync().then(()=>{ renderStudioList(); updateStudioProgress(); }); } });\n\nhydrateIcons();\napplyTheme();\nrenderDetail(); renderGrid(); renderTones();\nrenderCheck();\ninitWrite();\nmakeStudyList({items:ALLWORDS, groups:TOPICS, done:state.words, seg:'#topicSeg', list:'#wordList', count:'#wordCount', cls:''});\nmakeStudyList({items:ALLPHRASES, groups:PHRASE_GROUPS, done:state.phrases, seg:'#phraseSeg', list:'#phraseList', count:'#phraseCount', cls:'phrase'});\nrenderPairs();\n$('#voiceSel').addEventListener('change',e=>{ store.set('voice',e.target.value); loadVoices(); });\n$('#voiceTest').addEventListener('click',()=>speakSeq(['sửa','sữa'],false,900));\nrenderQuizHome();\nupdateProgress();\ninitStudio();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";

function renderAlphabet() {
  root.innerHTML = `
    ${brandHeader()}
    <div class="card" style="padding:18px 16px;">
      <button class="btn btn-ghost" id="back-home" style="margin-bottom:14px;">← Trang chủ</button>
      <div class="pill-header" style="margin-bottom:14px;">Bảng chữ cái &amp; phát âm</div>
      <iframe id="alphabet-frame" title="Bảng chữ cái và phát âm tiếng Việt"
        allow="microphone; autoplay; clipboard-write"
        style="width:100%; height:calc(100vh - 190px); min-height:560px; border:2px solid var(--peach-deep); border-radius:16px; background:#fff; display:block;"></iframe>
    </div>
    <footer class="app-footer">Đã đăng nhập: ${escapeHtml((auth.currentUser && auth.currentUser.email) || '')} · <a href="#" id="logout-link">Đăng xuất</a></footer>
  `;
  document.getElementById('alphabet-frame').srcdoc = ALPHABET_APP_HTML;
  document.getElementById('back-home').addEventListener('click', () => go('section-select'));
  document.getElementById('logout-link').addEventListener('click', (e) => { e.preventDefault(); forceLogout(''); });
}

/* ---------------- Man hinh chon muc hoc (trang chu moi) ---------------- */
function renderSectionSelect() {
  root.innerHTML = `
    ${brandHeader()}
    <div class="card">
      <div class="pill-header">Chọn mục học</div>
      <div class="unit-grid" style="grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));">
        <button class="unit-tile" id="sec-alphabet" style="text-align:left;">
          <div class="u-num">音</div>
          <div class="u-name">Bảng chữ cái &amp; phát âm</div>
          <div class="u-range">29 chữ cái · 6 thanh điệu · hội thoại · thu âm</div>
        </button>
        <button class="unit-tile" id="sec-quiz" style="text-align:left;">
          <div class="u-num">語</div>
          <div class="u-name">Luyện tập theo chương</div>
          <div class="u-range">${TV_CHAPTERS_META.length} chương</div>

        <button class="unit-tile" id="sec-flash-vls" style="text-align:left;">

          <div class="u-name">Flashcard từ vựng VLS</div>
          <div class="u-range">${fcChapterList('vls').length} bài · ${VLS_CARDS.length} từ vựng</div>

      </div>
    </div>
    <footer class="app-footer">Đã đăng nhập: ${escapeHtml((auth.currentUser && auth.currentUser.email) || '')} · <a href="#" id="logout-link">Đăng xuất</a></footer>

  document.getElementById('sec-alphabet').addEventListener('click', () => go('alphabet'));
  document.getElementById('sec-quiz').addEventListener('click', () => go('dashboard'));
  document.getElementById('sec-flash-vls').addEventListener('click', () => go('flash-dashboard', { fcSet: 'vls' }));
  document.getElementById('logout-link').addEventListener('click', (e) => { e.preventDefault(); forceLogout(''); });
}


/* ---------------- Dieu huong chinh ---------------- */
function render() {
  // Man hinh chu cai/phat am can rong hon cac man hinh khac
  const shell = document.querySelector('.app-shell');
  if (shell) shell.style.maxWidth = (state.screen === 'alphabet') ? '1040px' : '';
  if (state.screen === 'login') return renderLogin();
  if (state.screen === 'alphabet') return renderAlphabet();
  if (state.screen === 'section-select') return renderSectionSelect();
  if (state.screen === 'dashboard') return renderDashboard();
  if (state.screen === 'quiz') return renderQuiz();
  if (state.screen === 'result') return renderResult();
  if (state.screen === 'flash-dashboard') return renderFlashDashboard();
  if (state.screen === 'flash-study') return renderFlashStudy();
  if (state.screen === 'flash-quiz') return renderFlashQuiz();
  if (state.screen === 'flash-quiz-result') return renderFlashQuizResult();
}

auth.onAuthStateChanged(async (user) => {
  if (!user) { go('login'); return; }
  const mySessionId = localStorage.getItem('tv_session_id');
  if (!mySessionId) { go('login'); return; }
  try {
    const doc = await db.collection(USERS_COLLECTION).doc(user.uid).get();
    const data = doc.data();
    if (data && data.activeSessionId === mySessionId) {
      startSessionWatcher(user.uid, mySessionId);
      go('section-select');
    } else {
      forceLogout('Tài khoản này đã được đăng nhập ở một thiết bị khác.');
    }
  } catch (e) {
    go('login');
  }
});
