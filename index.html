<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Bảng màu lấy trực tiếp từ bộ slide PowerPoint đã làm (đo pixel
   thật từ ảnh render), không phải màu tự chọn — để giữ đúng
   nhận diện thương hiệu xuyên suốt tài liệu học + web luyện tập.
   ============================================================ */
:root {
  --navy: #1b4a7a;
  --navy-deep: #123152;
  --orange: #dd6f0c;
  --orange-soft: #f2934a;
  --peach: #fbe7d3;
  --peach-deep: #f6d3ab;
  --terracotta: #bd6f4f;
  --cream: #fbf8f4;
  --ink: #2a2018;
  --good: #2f7d4f;
  --bad: #b8462f;
  --font-head: "Zilla Slab", Georgia, serif;
  --font-ui: "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-jp: "Noto Sans JP", var(--font-ui);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.app-shell {
  width: 100%;
  max-width: 760px;
  padding: 28px 20px 64px;
  margin: 0 auto;
}

/* ---------- Header / thương hiệu ---------- */
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}
.brand-icon {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
}
.brand-text .brand-title {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 1.35rem;
  color: var(--navy-deep);
  line-height: 1.1;
}
.brand-text .brand-sub {
  font-size: 0.8rem;
  color: var(--terracotta);
  letter-spacing: 0.02em;
}

/* ---------- Thẻ / khung viền (giữ đúng phong cách vở học) ---------- */
.card {
  background: #fff;
  border: 2px solid var(--terracotta);
  border-radius: 22px;
  padding: 28px 26px;
  position: relative;
}
.card + .card { margin-top: 18px; }

.pill-header {
  display: inline-block;
  background: var(--peach);
  border: 2px solid var(--orange-soft);
  border-radius: 999px;
  padding: 6px 20px;
  font-family: var(--font-head);
  font-weight: 600;
  color: var(--navy-deep);
  margin-bottom: 18px;
}

/* ---------- Form đăng nhập ---------- */
.login-card { max-width: 420px; margin: 6vh auto 0; }
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--navy-deep);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #d8cdbf;
  border-radius: 10px;
  font-size: 1rem;
  font-family: var(--font-ui);
}
.field input:focus {
  outline: none;
  border-color: var(--orange);
  box-shadow: 0 0 0 3px rgba(221, 111, 12, 0.15);
}
.hint-box {
  background: var(--peach);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 0.82rem;
  color: var(--navy-deep);
  margin-top: 14px;
  line-height: 1.5;
}
.error-msg {
  color: var(--bad);
  font-size: 0.85rem;
  margin-top: 6px;
  min-height: 1em;
}

/* ---------- Nút bấm ---------- */
.btn {
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 0.95rem;
  border: none;
  border-radius: 999px;
  padding: 12px 26px;
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--orange); color: #fff; }
.btn-primary:hover { background: #c8620a; }
.btn-primary:disabled {
  background: #e5d9cb;
  color: #a99a86;
  cursor: not-allowed;
}
.btn-ghost {
  background: transparent;
  color: var(--navy);
  border: 1.5px solid var(--navy);
}
.btn-ghost:hover { background: rgba(27, 74, 122, 0.06); }
.btn-block { width: 100%; }

/* ---------- Lưới chọn Unit ---------- */
.unit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
}
.unit-tile {
  border: 2px solid var(--terracotta);
  border-radius: 16px;
  padding: 16px 14px;
  background: #fff;
  cursor: pointer;
  text-align: left;
  transition: transform 0.1s ease, box-shadow 0.15s ease;
}
.unit-tile:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.08); }
.unit-tile .u-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--orange);
  color: #fff;
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 8px;
}
.unit-tile .u-name { font-weight: 700; color: var(--navy-deep); font-size: 0.95rem; }
.unit-tile .u-range { font-size: 0.75rem; color: var(--terracotta); margin-top: 2px; }

.unit-tile.locked {
  cursor: not-allowed;
  opacity: 0.55;
  background: repeating-linear-gradient(135deg, #fff, #fff 10px, #faf6f0 10px, #faf6f0 20px);
}
.unit-tile.locked .u-num { background: #cbb9a4; }
.badge-soon {
  display: inline-block;
  font-size: 0.68rem;
  background: var(--peach);
  color: var(--terracotta);
  border-radius: 999px;
  padding: 2px 9px;
  margin-top: 6px;
  font-weight: 600;
}

/* ---------- Chọn đề ---------- */
.de-row { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
.de-tile {
  flex: 1;
  min-width: 160px;
  border: 2px solid var(--terracotta);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  background: #fff;
  cursor: pointer;
}
.de-tile:hover { background: var(--peach); }
.de-tile.locked { cursor: not-allowed; opacity: 0.5; }
.de-tile .de-title { font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; color: var(--navy-deep); }
.de-tile .de-meta { font-size: 0.8rem; color: var(--terracotta); margin-top: 4px; }

/* ---------- Màn hình làm bài ---------- */
.progress-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.progress-track {
  flex: 1;
  height: 8px;
  background: var(--peach);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--orange);
  border-radius: 999px;
  transition: width 0.25s ease;
}
.progress-label { font-size: 0.85rem; color: var(--navy-deep); font-weight: 600; white-space: nowrap; }

.q-number-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--orange);
  color: #fff;
  font-weight: 700;
  margin-bottom: 14px;
}
.q-prompt {
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 22px;
  line-height: 1.5;
}
.q-prompt .jp { font-family: var(--font-jp); font-size: 1.3rem; color: var(--navy-deep); }

.option-list { display: flex; flex-direction: column; gap: 10px; }
.option {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  border: 1.5px solid #d8cdbf;
  border-radius: 12px;
  padding: 13px 16px;
  background: #fff;
  cursor: pointer;
  font-family: var(--font-jp);
  font-size: 1rem;
  color: var(--ink);
}
.option:hover { border-color: var(--orange-soft); background: #fffaf4; }
.option .opt-letter {
  flex-shrink: 0;
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1.5px solid #cbbba6;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: 700; color: var(--terracotta);
  font-family: var(--font-ui);
}
.option.selected { border-color: var(--orange); background: var(--peach); }
.option.selected .opt-letter { background: var(--orange); border-color: var(--orange); color: #fff; }
.option:disabled { cursor: default; }
.option.correct { border-color: var(--good); background: #f0faf3; }
.option.correct .opt-letter { background: var(--good); border-color: var(--good); color: #fff; }
.option.wrong { border-color: var(--bad); background: #fdf1ef; }
.option.wrong .opt-letter { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt-mark { margin-left: auto; font-weight: 700; }
.option.correct .opt-mark { color: var(--good); }
.option.wrong .opt-mark { color: var(--bad); }
.answer-feedback { margin-top: 14px; padding: 10px 14px; border-radius: 12px; font-weight: 600; font-size: 0.92rem; }
.answer-feedback--ok { background: #f0faf3; color: var(--good); }
.answer-feedback--bad { background: #fdf1ef; color: var(--bad); }
.answer-feedback b { text-decoration: underline; }

.quiz-nav { display: flex; justify-content: space-between; margin-top: 26px; }

/* ---------- Kết quả ---------- */
.score-hero { text-align: center; padding: 10px 0 20px; }
.score-num { font-family: var(--font-head); font-size: 3.2rem; font-weight: 700; color: var(--orange); }
.score-sub { color: var(--navy-deep); font-weight: 600; }

.review-item {
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 10px;
  border: 1.5px solid #e6ddd0;
}
.review-item.correct { border-color: #bfe2c9; background: #f3fbf5; }
.review-item.wrong { border-color: #f0c4b7; background: #fdf4f1; }
.review-item .r-prompt { font-weight: 600; margin-bottom: 4px; }
.review-item .r-line { font-size: 0.88rem; }
.review-item .r-line.your { color: var(--bad); }
.review-item .r-line.correct-ans { color: var(--good); }

.hidden { display: none !important; }

footer.app-footer {
  text-align: center;
  font-size: 0.78rem;
  color: #a99a86;
  margin-top: 40px;
}

/* ============================================================
   FLASHCARD TU VUNG VLS -- CSS lay tu kimoanh.tiengnhat
   ============================================================ */
.fc-panel { padding: 22px 18px 26px; }

.fc-wrap { container-type: inline-size; width: 100%; }
.fc-stage { perspective: 1800px; }

.fc-card {
  position: relative;
  width: 100%;
  aspect-ratio: 1196 / 380;
  border-radius: 2.6cqw;
  transform-style: preserve-3d;
  transition: transform .6s cubic-bezier(.4, .15, .2, 1);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.fc-card.is-flipped { transform: rotateY(180deg); }
.fc-card.fc-noanim { transition: none; }
.fc-card:focus-visible { outline: 3px solid var(--orange, #dd6f0c); outline-offset: 5px; }

.fc-face {
  position: absolute;
  inset: 0;
  box-sizing: border-box;
  overflow: hidden;
  border-radius: 2.6cqw;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  color: #012157;
}

/* ---------- MẶT TRƯỚC · khung hồng ---------- */
.fc-face--pink {
  background: #FEF7F3;
  border: .6cqw solid #F6BAC1;
  box-shadow: 0 .5cqw 1.8cqw rgba(226, 130, 145, .14), inset 0 0 0 .18cqw rgba(255, 255, 255, .55);
}
/* ---------- MẶT SAU · khung xanh dương ---------- */
.fc-face--blue {
  background: #FDFBF6;
  border: .6cqw solid #92BBEC;
  box-shadow: 0 .5cqw 1.8cqw rgba(90, 140, 210, .14), inset 0 0 0 .18cqw rgba(255, 255, 255, .55);
  transform: rotateY(180deg);
}

.fc-d { position: absolute; display: block; overflow: visible; pointer-events: none; }

/* ----- mặt hồng: tiêu đề "色 SẮC" + vệt cọ + tia ----- */
.fc-title {
  position: absolute;
  left: 50%;
  top: 24.7%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  gap: .3em;
  padding: .17em .46em;
  font-size: 7.7cqw;
  font-weight: 800;
  line-height: 1.15;
  white-space: nowrap;
}
.fc-title .fc-k { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-weight: 900; }
.fc-title .fc-hv {
  font-family: "Inter", "Noto Sans", "Segoe UI", Arial, sans-serif;
  letter-spacing: .01em;
}
.fc-title .fc-k, .fc-title .fc-hv { position: relative; z-index: 1; }
.fc-brush { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.fc-rays { position: absolute; top: 50%; width: .47em; height: .92em; transform: translateY(-50%); overflow: visible; }
.fc-rays--l { right: calc(100% + .26em); }
.fc-rays--r { left: calc(100% + .26em); }

/* ----- mặt hồng: khung âm đọc nét đứt ----- */
.fc-read {
  position: absolute;
  left: 50%;
  top: 47.3%;
  transform: translateX(-50%);
  box-sizing: border-box;
  width: max-content;
  min-width: 70%;
  max-width: 80%;
  min-height: 29%;
  padding: 1.1cqw 3.4cqw;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  column-gap: .8em;
  row-gap: .02em;
  font-size: calc(var(--r, 4.9) * 1cqw);
  line-height: 1.3;
  border-radius: 3.6cqw;
  background: rgba(255, 255, 255, .42);
  white-space: nowrap;
}
.fc-read--stack { flex-direction: column; flex-wrap: nowrap; row-gap: .12em; max-width: 78%; padding-top: 1.6cqw; padding-bottom: 1.6cqw; }
.fc-dash { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.fc-dash rect {
  fill: none;
  stroke: #FDB4BB;
  stroke-width: .34cqw;
  stroke-dasharray: 1.55cqw 1.5cqw;
  stroke-linecap: round;
  rx: 3.6cqw;
}
.fc-r { position: relative; display: inline-flex; align-items: baseline; gap: .38em; }
.fc-lab { font-family: "Inter", "Noto Sans", "Segoe UI", Arial, sans-serif; font-weight: 600; }
.fc-kana { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-weight: 500; }

/* ----- mặt xanh: các từ ghép ngăn cách bằng dấu / nghiêng ----- */
.fc-words {
  position: absolute;
  left: 10.5%;
  right: 10.5%;
  top: 10%;
  bottom: 28%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  font-weight: 900;
  font-size: calc(var(--k, 7) * 1cqw);
  line-height: 1.22;
  text-align: center;
}
.fc-words--multi { left: 14%; right: 14%; }
.fc-words-in { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; row-gap: .12em; }
.fc-w { display: inline-flex; align-items: center; white-space: nowrap; }
.fc-w:not(:last-child)::after {
  content: "";
  display: inline-block;
  width: .062em;
  height: .84em;
  margin: 0 .4em 0 .44em;
  background: #4573A8;
  border-radius: .05em;
  transform: rotate(21deg);
}

/* ----- điều khiển bên dưới thẻ (dùng ngôn ngữ thiết kế sẵn có của trang) ----- */
.fc-hint { text-align: center; font-size: .82rem; color: var(--terracotta, #bd6f4f); margin: 16px 0 4px; }
.fc-tools { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px; }
.fc-tools .btn { padding: 9px 18px; font-size: .85rem; }
.fc-tools .btn[aria-pressed="true"] { background: var(--peach, #fbe7d3); border-color: var(--orange, #dd6f0c); }
.fc-chip-row { margin-top: 6px; font-size: .74rem; color: var(--terracotta, #bd6f4f); }

/* ----- điện thoại: thẻ cao hơn để chữ đủ lớn, giữ nguyên bố cục/màu/trang trí ----- */
@container (max-width: 540px) {
  .fc-card { aspect-ratio: 2 / 1; }
  .fc-title { font-size: 9.4cqw; top: 22.5%; }
  .fc-words--multi { left: 13%; right: 13%; }
  .fc-words { font-size: calc(var(--k, 7) * 1.3cqw); left: 12%; right: 12%; top: 11%; bottom: 27%; }
  .fc-read { font-size: calc(var(--r, 4.9) * 1.1cqw); top: 45%; min-width: 72%; max-width: 82%; min-height: 0; flex-direction: column; flex-wrap: nowrap; row-gap: .1em; padding: 2.2cqw 3cqw; }
}
@media (max-width: 600px) { .fc-kbd { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .fc-card { transition: none; }
}

/* ============================================================
   FLASHCARD SHINKANZEN TV N3 — cùng bộ màu / trang trí / phông chữ với Flashcard Kanji
   Mặt trước (hồng): từ vựng · Mặt sau (xanh): Cách đọc – Nghĩa – Ví dụ
   ============================================================ */
.fc-card.fc-card--sv { aspect-ratio: 1196 / 470; }
.fc-face .fc-title.fc-title--word { top: 50%; font-size: calc(var(--w, 11) * 1cqw); }
.fc-title--word .fc-k { line-height: 1.2; }

.fc-sv-back {
  position: absolute;
  left: 13%;
  right: 16%;
  top: 8.5%;
  bottom: 12%;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.6cqw 3.2cqw;
  border-radius: 3.6cqw;
  background: rgba(255, 255, 255, .5);
  font-size: calc(var(--s, 3.9) * 1cqw);
  line-height: 1.34;
  color: #012157;
  overflow: hidden;
}
.fc-sv-back .fc-dash rect { stroke: #9EC3F0; }
.fc-sv-in {
  position: relative;
  width: 100%;
  display: flex;
  flex-direction: column;
  row-gap: .3em;
}
.fc-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: .5em;
}
.fc-sv-in .fc-lab { flex: 0 0 auto; font-weight: 700; white-space: nowrap; }
.fc-sv-val { flex: 1 1 auto; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.fc-sv-vi { font-family: "Inter", "Noto Sans", "Segoe UI", Arial, sans-serif; font-weight: 600; }
.fc-sv-jp { display: block; font-weight: 700; }
.fc-sv-tr { display: block; font-family: "Inter", "Noto Sans", "Segoe UI", Arial, sans-serif; font-weight: 500; font-size: .9em; margin-top: .06em; }

@container (max-width: 540px) {
  .fc-card.fc-card--sv { aspect-ratio: 3 / 2; }
  .fc-face .fc-title.fc-title--word { top: 50%; font-size: calc(var(--w, 11) * 1.2cqw); }
  .fc-sv-back { left: 11.5%; right: 13.5%; top: 9%; bottom: 13%; padding: 2.2cqw 3.4cqw; border-radius: 4.4cqw; }
}

</style>

const auth = firebase.auth();
const db = firebase.firestore();
const USERS_COLLECTION = 'testtiengviet';

let sessionUnsub = null;
function genSessionId() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); }

function startSessionWatcher(uid, mySessionId) {
  stopSessionWatcher();
  sessionUnsub = db.collection(USERS_COLLECTION).doc(uid).onSnapshot(doc => {
    const data = doc.data();
    if (data && data.activeSessionId && data.activeSessionId !== mySessionId) {
      forceLogout('Tài khoản này vừa được đăng nhập ở một thiết bị khác.');
    }
  });
}
function stopSessionWatcher() { if (sessionUnsub) { sessionUnsub(); sessionUnsub = null; } }
function forceLogout(message) {
  stopSessionWatcher();
  localStorage.removeItem('tv_session_id');
  auth.signOut();
  go('login', { loginNotice: message || '' });
}

let state = { screen: 'login', quiz: null, lastResult: null };
const root = document.getElementById('app-root');
root.innerHTML = '<div class="card" style="text-align:center; color:var(--navy-deep);">Đang tải...</div>';

function go(screen, payload) {
  state.screen = screen;
  if (payload) Object.assign(state, payload);
  render();
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }
function formatPrompt(q) {
  return escapeHtml(q.prompt)
    .replace(/「(.+?)」/g, '「<span class="jp">$1</span>」')
    .replace(/"(.+?)"/g, '"<span>$1</span>"');
}

async function doLogin() {
  const email = document.getElementById('in-user').value.trim();
  const pass = document.getElementById('in-pass').value;
  const err = document.getElementById('login-error');
  const btn = document.getElementById('btn-login');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Vui lòng nhập đầy đủ email và mật khẩu.'; return; }
  btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
  try {
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    const uid = cred.user.uid;
    const mySessionId = genSessionId();
    localStorage.setItem('tv_session_id', mySessionId);
    await db.collection(USERS_COLLECTION).doc(uid).set({
      email: email, activeSessionId: mySessionId,
      lastLoginAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
    startSessionWatcher(uid, mySessionId);
    go('section-select');
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Đăng nhập';
    const map = {
      'auth/invalid-email': 'Email không hợp lệ.', 'auth/user-not-found': 'Tài khoản không tồn tại.',
      'auth/wrong-password': 'Sai mật khẩu.', 'auth/invalid-credential': 'Sai email hoặc mật khẩu.',
      'auth/too-many-requests': 'Bạn thử sai quá nhiều lần, vui lòng thử lại sau.',
    };
    err.textContent = map[e.code] || ('Đăng nhập thất bại (' + e.code + ')');
  }
}

/* ---------------- Lam bai: hien dung/sai ngay sau khi chon ---------------- */
function renderQuiz() {
  const { questions, index, answers, chNo } = state.quiz;
  const q = questions[index];
  const total = questions.length;
  const selected = answers[q.q_num];
  const answered = selected !== undefined;

  const optionsHtml = q.options.map((opt, i) => {
    const letter = String.fromCharCode(65 + i);
    const isSel = selected === opt;
    let cls = isSel ? 'selected' : '';
    if (answered) cls = opt === q.answer ? 'correct' : (isSel ? 'wrong' : '');
    const mark = answered && opt === q.answer ? '<span class="opt-mark">✓</span>' : (answered && isSel ? '<span class="opt-mark">✗</span>' : '');
    return `
      <button class="option ${cls}" data-opt="${escapeAttr(opt)}" ${answered ? 'disabled' : ''}>
        <span class="opt-letter">${letter}</span>
        <span>${escapeHtml(opt)}</span>
        ${mark}
      </button>`;
  }).join('');

  const isLast = index === total - 1;
  const kindLabel = q.type === 'J2V' ? 'Nhật → Việt' : 'Việt → Nhật';
  const feedback = !answered ? '' : (selected === q.answer
    ? `<div class="answer-feedback answer-feedback--ok">✓ Chính xác!</div>`
    : `<div class="answer-feedback answer-feedback--bad">✗ Chưa đúng. Đáp án đúng: <b>${escapeHtml(q.answer)}</b></div>`);

  root.innerHTML = `
    ${brandHeader()}
    <div class="card">
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" style="width:${(index / total) * 100}%"></div></div>
        <div class="progress-label">Câu ${index + 1}/${total}</div>
      </div>
      <div class="q-number-badge">${q.q_num}</div>
      <div style="font-size:0.78rem; color:var(--terracotta); font-weight:600; margin-bottom:6px;">${kindLabel}</div>
      <div class="q-prompt">${formatPrompt(q)}</div>
      <div class="option-list">${optionsHtml}</div>
      ${feedback}
      <div class="quiz-nav">
        <button class="btn btn-ghost" id="btn-prev" ${index === 0 ? 'disabled' : ''}>← Câu trước</button>
        <button class="btn btn-primary" id="btn-next" ${answered ? '' : 'disabled'}>${isLast ? 'Nộp bài' : 'Câu tiếp →'}</button>
      </div>
    </div>
  `;

  root.querySelectorAll('.option').forEach(el => {
    el.addEventListener('click', () => {
      if (state.quiz.answers[q.q_num] !== undefined) return;
      state.quiz.answers[q.q_num] = el.dataset.opt;
      renderQuiz();
    });
  });
  document.getElementById('btn-prev').addEventListener('click', () => { state.quiz.index = Math.max(0, index - 1); renderQuiz(); });
  document.getElementById('btn-next').addEventListener('click', () => {
    if (isLast) { submitQuiz(); } else { state.quiz.index = index + 1; renderQuiz(); }
  });
}

function submitQuiz() {
  const { questions, answers, chNo } = state.quiz;
  let correct = 0;
  const detail = questions.map(q => {
    const your = answers[q.q_num];
    const ok = your === q.answer;
    if (ok) correct++;
    return Object.assign({}, q, { your, ok });
  });
  saveAttempt(chNo, correct, questions.length);
  go('result', { lastResult: { correct, total: questions.length, detail, chNo } });
}

function saveAttempt(chNo, correct, total) {
  const user = auth.currentUser;
  if (!user) return;
  db.collection(USERS_COLLECTION).doc(user.uid).collection('attempts').add({
    chapter: chNo, score: correct, total: total,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  }).catch(err => console.error('Khong luu duoc lich su:', err));
}

}

function fcSakura(cx, cy, r, rot) {
  const petal = 'M0 0 C-.44 -.12 -.54 -.66 -.27 -.94 C-.19 -1.02 -.08 -.97 0 -.85 C.08 -.97 .19 -1.02 .27 -.94 C.54 -.66 .44 -.12 0 0Z';
  let g = `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${r})">`;
  for (let i = 0; i < 5; i++) {
    g += `<g transform="rotate(${i * 72})">
      <path d="${petal}" fill="#FBA3A8"/>
      <path d="${petal}" transform="scale(.7)" fill="#FDBABD" opacity=".55"/>
      <path d="M0 -.12 L0 -.6" stroke="#F3858E" stroke-width=".03" stroke-linecap="round" opacity=".5"/>
    </g>`;
  }
  for (let i = 0; i < 5; i++) {
    const a = (36 + i * 72) * Math.PI / 180, x = Math.sin(a) * .3, y = -Math.cos(a) * .3;
    g += `<line x1="0" y1="0" x2="${x.toFixed(3)}" y2="${y.toFixed(3)}" stroke="#FFF3EA" stroke-width=".055" stroke-linecap="round"/>
          <circle cx="${x.toFixed(3)}" cy="${y.toFixed(3)}" r=".05" fill="#FFF3EA"/>`;
  }
  return g + '<circle r=".09" fill="#FFF6EF"/></g>';
}

function fcShuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

const FC_SETS = {
  vls: {
    name: 'Flashcard từ vựng VLS', unit: 'Bài', item: 'từ', key: 'lesson', cards: () => VLS_CARDS,
    sv: true, front: fcFrontVls, back: fcBackVls, fit: fcFitSv,
    aria: (c) => 'Thẻ từ vựng ' + c.vi + '. Nhấn để lật thẻ',
    desc: 'Mặt trước: từ tiếng Việt. Mặt sau: nghĩa tiếng Nhật, câu ví dụ và từ loại. Chạm vào thẻ để lật.',

};

/* ---------- Mat the: truoc = tu Viet, sau = nghia Nhat + vi du + tu loai ---------- */
function fcSvTitleScale(w) {
  const n = [...w].length;
  if (n <= 4) return 11;
  if (n <= 8) return 9;
  if (n <= 14) return 7;
  if (n <= 20) return 5.8;
  return 4.8;
}
function fcFrontVls(c) {
  return `
    <div class="fc-face fc-face--pink">
      ${FC_DECOR_PINK}
      <div class="fc-title fc-title--word" style="--w:${fcSvTitleScale(c.vi)}">${FC_BRUSH}${FC_RAYS_L}${FC_RAYS_R}
        <span class="fc-hv">${escapeHtml(c.vi)}</span></div>

}
function fcBackVls(c) {
  return `
    <div class="fc-face fc-face--blue">

        <svg class="fc-dash" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" rx="26"/></svg>

/* Tu thu nho chu cho vua khung the (dung chung cho moi bo the kieu "sv") */
function fcFitSv(card) {
  const face = card.querySelector('.fc-face--pink'), t = card.querySelector('.fc-title--word');
  if (face && t) {
    let w = parseFloat(t.style.getPropertyValue('--w')) || 11, guard = 40;
    const over = () => t.offsetWidth + parseFloat(getComputedStyle(t).fontSize) * 1.55 > face.clientWidth * 0.93;
    while (over() && w > 2.5 && guard--) { w -= 0.35; t.style.setProperty('--w', w.toFixed(2)); }
  }
  const box = card.querySelector('.fc-sv-back'), inn = card.querySelector('.fc-sv-in');
  if (box && inn) {
    const cs = getComputedStyle(box);
    const avail = () => box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    let s = card.clientWidth <= 540 ? 5.5 : 3.9, guard = 80;
    box.style.setProperty('--s', s);
    while (inn.offsetHeight > avail() && s > 1.6 && guard--) { s -= 0.1; box.style.setProperty('--s', s.toFixed(2)); }
  }
}

/* ---------- Chon bai ---------- */
function fcChapterList(setId) {
  const S = FC_SETS[setId || state.fcSet] || FC_SETS.vls;
  const map = new Map();
  S.cards().forEach((c, i) => {
    if (!map.has(c[S.key])) map.set(c[S.key], []);
    map.get(c[S.key]).push(i);
  });
  return [...map.entries()].sort((a, b) => a[0] - b[0]);
}

  const S = fcSet(), CARDS = S.cards(), unitLc = S.unit.toLowerCase();

/* ---------- Hoc flashcard ---------- */
function startFlash(chapter) {
  const deck = [];
  const S = fcSet();
  S.cards().forEach((c, i) => { if (chapter === 'all' || String(c[S.key]) === String(chapter)) deck.push(i); });
  go('flash-study', { fc: { chapter, deck, i: 0, startBack: false, shuffled: false } });
}

function renderFlashStudy() {
  const f = state.fc;
  root.innerHTML = `
    ${brandHeader()}

        </div>
      </div></div>
      <div class="fc-hint">Chạm vào thẻ để lật<span class="fc-kbd"> · phím ← → đổi thẻ, Space để lật</span></div>

        <button class="btn btn-ghost" id="fc-prev">← Thẻ trước</button>

      <div class="fc-tools">
        <button class="btn btn-ghost" id="fc-shuffle" aria-pressed="false">Xáo trộn</button>

        <button class="btn btn-primary" id="fc-quiz">📝 Luyện tập</button>

      </div>
    </div>
  `;
  const card = document.getElementById('fc-card');
  card.addEventListener('click', fcFlip);
  document.getElementById('fc-prev').addEventListener('click', () => fcMove(-1));
  document.getElementById('fc-next').addEventListener('click', () => fcMove(1));
  document.getElementById('fc-list').addEventListener('click', () => go('flash-dashboard'));
  document.getElementById('fc-quiz').addEventListener('click', () => startFlashQuiz(f.chapter));
  document.getElementById('fc-shuffle').addEventListener('click', () => {
    f.shuffled = !f.shuffled;
    if (f.shuffled) fcShuffle(f.deck); else f.deck.sort((a, b) => a - b);
    f.i = 0; fcUpdate(true);
  });
  document.getElementById('fc-swap').addEventListener('click', () => {
    f.startBack = !f.startBack; fcUpdate(true);
  });
  let sx = null;
  card.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  card.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 55) { e.preventDefault(); fcMove(dx < 0 ? 1 : -1); }
  });
  fcUpdate(true);
  fcBindKeys();
}

function fcFlip() {
  const card = document.getElementById('fc-card');
  if (card) card.classList.toggle('is-flipped');
}
function fcMove(step) {
  const f = state.fc; if (!f) return;
  const n = f.deck.length;
  f.i = Math.min(n - 1, Math.max(0, f.i + step));
  fcUpdate(true);
}
function fcUpdate(resetFlip) {
  const f = state.fc, card = document.getElementById('fc-card');
  if (!f || !card) return;
  const S = fcSet(), c = S.cards()[f.deck[f.i]];
  card.classList.toggle('fc-card--sv', !!S.sv);
  if (resetFlip) {
    card.classList.add('fc-noanim');
    card.classList.toggle('is-flipped', f.startBack);
  }
  card.innerHTML = S.front(c) + S.back(c);
  if (S.fit) S.fit(card);
  if (resetFlip) { void card.offsetWidth; card.classList.remove('fc-noanim'); }
  const total = f.deck.length;
  document.getElementById('fc-bar').style.width = ((f.i + 1) / total * 100) + '%';
  document.getElementById('fc-count').textContent =
    (f.chapter === 'all' ? 'Tất cả' : fcSet().unit + ' ' + f.chapter) + ' · ' + (f.i + 1) + '/' + total;
  document.getElementById('fc-prev').disabled = f.i === 0;
  document.getElementById('fc-next').disabled = f.i === total - 1;
  card.setAttribute('aria-label', S.aria ? S.aria(c) : 'Thẻ từ vựng. Nhấn để lật thẻ');
  const shuf = document.getElementById('fc-shuffle'), swap = document.getElementById('fc-swap');
  shuf.setAttribute('aria-pressed', String(f.shuffled)); shuf.textContent = f.shuffled ? 'Đúng thứ tự' : 'Xáo trộn';
  swap.setAttribute('aria-pressed', String(f.startBack)); swap.textContent = f.startBack ? 'Hiện mặt hồng trước' : 'Hiện mặt xanh trước';
}
let fcKeysBound = false;
function fcRefit() {
  if (state.screen !== 'flash-study') return;
  const S = fcSet(), card = document.getElementById('fc-card');
  if (S.fit && card) S.fit(card);
}
function fcBindKeys() {
  if (fcKeysBound) return;
  fcKeysBound = true;
  window.addEventListener('resize', fcRefit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fcRefit);
  document.addEventListener('keydown', (e) => {
    if (state.screen !== 'flash-study') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); fcMove(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); fcMove(-1); }
    else if ((e.key === ' ' || e.key === 'Enter') && document.activeElement && document.activeElement.id === 'fc-card') { e.preventDefault(); fcFlip(); }
    else if (e.key === ' ' && !/^(BUTTON|INPUT|A)$/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); fcFlip(); }
  });
}

/* ============================================================
   LUYEN TAP flashcard VLS -- sinh cau hoi truc tiep tu VLS_CARDS,
   2 chieu Viet->Nhat (V2J) va Nhat->Viet (J2V), loai nhieu theo
   CA "vi" lan "ja" cua dap an dung de dam bao chi 1 dap an dung.
   ============================================================ */
function fcPickDistractorsBy(items, excludeFn, valueFn, n, extraItems) {
  const seen = new Set();
  const out = [];
  for (const it of fcShuffle(items)) {
    if (excludeFn(it)) continue;
    const v = valueFn(it);
    if (v && !seen.has(v)) { seen.add(v); out.push(v); if (out.length === n) break; }
  }
  if (out.length < n && extraItems) {
    for (const it of fcShuffle(extraItems)) {
      if (out.length === n) break;
      if (excludeFn(it)) continue;
      const v = valueFn(it);
      if (v && !seen.has(v)) { seen.add(v); out.push(v); }
    }
  }
  return out;
}

function fcVlsQuestions(idxs) {
  const CARDS = VLS_CARDS;
  const deck = idxs.map(i => CARDS[i]);
  const qs = [];
  deck.forEach(c => {
    const order = fcShuffle(['V2J', 'J2V']);
    for (const type of order) {
      if (type === 'V2J') {
        // nhieu la nghia tieng Nhat khac - loai ung vien trung "ja" HOAC trung "vi"
        // voi dap an dung, tranh 2 tu khac nhau cung nghia hoac 1 tu co nhieu nghia.
        const distractors = fcPickDistractorsBy(deck, it => it.ja === c.ja || it.vi === c.vi, it => it.ja, 3, CARDS);
        if (distractors.length < 3) continue;
        qs.push({ type: 'V2J', prompt: `"${c.vi}" tiếng Nhật là gì?`, options: fcShuffle([c.ja, ...distractors]), answer: c.ja });
        break;
      } else {
        // nhieu la tu tieng Viet khac - loai ung vien trung "vi" HOAC trung "ja"
        // voi dap an dung, cung ly do tren.
        const distractors = fcPickDistractorsBy(deck, it => it.vi === c.vi || it.ja === c.ja, it => it.vi, 3, CARDS);
        if (distractors.length < 3) continue;
        qs.push({ type: 'J2V', prompt: `「${c.ja}」 nghĩa tiếng Việt là gì?`, options: fcShuffle([c.vi, ...distractors]), answer: c.vi });
        break;
      }
    }
  });
  return qs;
}

function startFlashQuiz(chapter) {
  const setId = state.fcSet || 'vls';
  const S = FC_SETS[setId];
  const idxs = [];
  S.cards().forEach((c, i) => { if (chapter === 'all' || String(c[S.key]) === String(chapter)) idxs.push(i); });
  let questions = fcVlsQuestions(idxs);
  questions = fcShuffle(questions).map((q, i) => Object.assign({}, q, { q_num: i + 1 }));
  go('flash-quiz', { fquiz: { setId, chapter, questions, index: 0, answers: {} } });
}

function renderFlashQuiz() {
  const { questions, index, answers } = state.fquiz;
  const total = questions.length;
  if (!total) {
    root.innerHTML = `
      ${brandHeader()}
      <div class="card" style="text-align:center;">
        <p style="color:var(--navy-deep);">Nhóm này chưa có đủ dữ liệu để tạo câu luyện tập (cần ít nhất 4 thẻ khác nhau).</p>
        <button class="btn btn-ghost" id="fc-quiz-back">← Về danh sách</button>
      </div>`;
    document.getElementById('fc-quiz-back').addEventListener('click', () => go('flash-dashboard'));
    return;
  }
  const q = questions[index];
  const selected = answers[q.q_num];
  const answered = selected !== undefined;
  const optionsHtml = q.options.map((opt, i) => {
    const letter = String.fromCharCode(65 + i);
    const isSel = selected === opt;
    const jp = /[぀-ヿ一-鿿]/.test(opt) ? 'jp' : '';
    let cls = isSel ? 'selected' : '';
    if (answered) cls = opt === q.answer ? 'correct' : (isSel ? 'wrong' : '');
    const mark = answered && opt === q.answer ? '<span class="opt-mark">✓</span>' : (answered && isSel ? '<span class="opt-mark">✗</span>' : '');
    return `
      <button class="option ${cls}" data-opt="${escapeAttr(opt)}" ${answered ? 'disabled' : ''}>
        <span class="opt-letter">${letter}</span>
        <span class="${jp}">${escapeHtml(opt)}</span>
        ${mark}
      </button>`;
  }).join('');
  const isLast = index === total - 1;
  const kindLabel = q.type === 'J2V' ? 'Nhật → Việt' : 'Việt → Nhật';
  const feedback = !answered ? '' : (selected === q.answer
    ? `<div class="answer-feedback answer-feedback--ok">✓ Chính xác!</div>`
    : `<div class="answer-feedback answer-feedback--bad">✗ Chưa đúng. Đáp án đúng: <b>${escapeHtml(q.answer)}</b></div>`);
  root.innerHTML = `
    ${brandHeader()}
    <div class="card">
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" style="width:${(index / total) * 100}%"></div></div>
        <div class="progress-label">Câu ${index + 1}/${total}</div>
      </div>
      <div class="q-number-badge">${q.q_num}</div>
      <div style="font-size:0.78rem; color:var(--terracotta); font-weight:600; margin-bottom:6px;">${kindLabel}</div>
      <div class="q-prompt">${formatPrompt(q)}</div>
      <div class="option-list">${optionsHtml}</div>
      ${feedback}
      <div class="quiz-nav">
        <button class="btn btn-ghost" id="btn-prev" ${index === 0 ? 'disabled' : ''}>← Câu trước</button>
        <button class="btn btn-primary" id="btn-next" ${answered ? '' : 'disabled'}>
          ${isLast ? 'Nộp bài' : 'Câu tiếp →'}
        </button>
      </div>
    </div>
  `;
  root.querySelectorAll('.option').forEach(el => {
    el.addEventListener('click', () => {
      if (state.fquiz.answers[q.q_num] !== undefined) return;
      state.fquiz.answers[q.q_num] = el.dataset.opt; renderFlashQuiz();
    });
  });
  document.getElementById('btn-prev').addEventListener('click', () => { state.fquiz.index = Math.max(0, index - 1); renderFlashQuiz(); });
  document.getElementById('btn-next').addEventListener('click', () => {
    if (isLast) submitFlashQuiz(); else { state.fquiz.index = index + 1; renderFlashQuiz(); }
  });
}

function submitFlashQuiz() {
  const { questions, answers, setId, chapter } = state.fquiz;
  let correct = 0;
  const detail = questions.map(q => {
    const your = answers[q.q_num]; const ok = your === q.answer;
    if (ok) correct++;
    return Object.assign({}, q, { your, ok });
  });
  go('flash-quiz-result', { fquizResult: { correct, total: questions.length, detail, setId, chapter } });
}

function renderFlashQuizResult() {
  const { correct, total, detail, setId, chapter } = state.fquizResult;
  const pct = total ? Math.round((correct / total) * 100) : 0;
  const S = FC_SETS[setId];
  const items = detail.map(d => `
    <div class="review-item ${d.ok ? 'correct' : 'wrong'}">
      <div class="r-prompt">Câu ${d.q_num}: ${formatPrompt(d)}</div>
      ${d.ok
        ? `<div class="r-line correct-ans">✓ Bạn chọn đúng: ${escapeHtml(d.answer)}</div>`
        : `<div class="r-line your">✗ Bạn chọn: ${escapeHtml(d.your || '(bỏ trống)')}</div>
           <div class="r-line correct-ans">✓ Đáp án đúng: ${escapeHtml(d.answer)}</div>`}
    </div>
  `).join('');
  root.innerHTML = `
    ${brandHeader()}
    <div class="card">
      <div class="score-hero">
        <div class="score-num">${correct}/${total}</div>
        <div class="score-sub">${pct}% chính xác — Luyện tập ${S.name} ${chapter === 'all' ? '· Tất cả' : '· ' + S.unit + ' ' + chapter}</div>
      </div>
      <div style="display:flex; gap:12px; justify-content:center; margin-bottom:26px;">
        <button class="btn btn-primary" id="btn-retry">Làm lại</button>
        <button class="btn btn-ghost" id="btn-home">Về danh sách ${S.unit.toLowerCase()}</button>
      </div>
      <div class="pill-header">Xem lại đáp án</div>
      ${items}
    </div>
  `;
  document.getElementById('btn-retry').addEventListener('click', () => { state.fcSet = setId; startFlashQuiz(chapter); });
  document.getElementById('btn-home').addEventListener('click', () => { state.fcSet = setId; state.fcMode = 'quiz'; go('flash-dashboard'); });
}

// >>> DIEN EMAIL ADMIN VAO DAY. Chi cac email nay moi thay va dung duoc phong thu am. Vi du: ['admin@vidu.com', 'co.giao@vidu.com']
// Luu y: phai dat dung cac email nay trong quy tac Firestore (xem huong dan di kem) de viec chan duoc ap dung o may chu.
const TV_ADMIN_EMAILS = [];
const VOICE_COLLECTION = 'testtiengviet_voice';

function tvIsAdmin() {
  const u = auth.currentUser;
  if (!u || !u.email) return false;
  const me = u.email.trim().toLowerCase();
  return TV_ADMIN_EMAILS.some(e => String(e).trim().toLowerCase() === me);
}
// ID tai lieu on dinh tu noi dung cau (khong chua ky tu cam trong ID Firestore)
function tvVoiceId(text) {
  let a = 0x811c9dc5, b = 0xc2b2ae35;
  const s = String(text).normalize('NFC');
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    a = Math.imul(a ^ c, 0x01000193) >>> 0;
    b = Math.imul(b ^ (c + i), 0x85ebca6b) >>> 0;
  }
  return 'v' + a.toString(16).padStart(8, '0') + b.toString(16).padStart(8, '0');
}
// Cau noi cho ung dung chu cai/phat am (chay trong iframe cung goc)
window.TV_VOICE = {
  isAdmin: tvIsAdmin,
  // Moi hoc vien: lay cac ban ghi thay doi tu moc thoi gian "since" (0 = lay het)
  async fetchSince(since) {
    const snap = await db.collection(VOICE_COLLECTION).where('ts', '>', since || 0).orderBy('ts').get();
    return snap.docs.map(d => d.data());
  },
  // Chi admin: luu / cap nhat mot ban thu
  async put(text, rec) {
    if (!tvIsAdmin()) throw new Error('not-admin');
    await db.collection(VOICE_COLLECTION).doc(tvVoiceId(text)).set({
      text: String(text), mime: rec.mime, dur: rec.dur || 0, ts: rec.ts || Date.now(),
      data: rec.data, deleted: false, by: auth.currentUser.email,
    });
  },
  // Chi admin: xoa (ghi dau "da xoa" de cac may khac dong bo duoc)
  async del(text) {
    if (!tvIsAdmin()) throw new Error('not-admin');
    await db.collection(VOICE_COLLECTION).doc(tvVoiceId(text)).set({
      text: String(text), mime: '', dur: 0, ts: Date.now(), data: '', deleted: true, by: auth.currentUser.email,
    });
  },
};

primary-ink);box-shadow:var(--shadow)}\n.tab.active .vi{color:inherit;opacity:.8}\n\n/* ===== Layout ===== */\nmain{max-width:1080px;margin:0 auto;padding:18px 16px 60px}\n.panel{display:none;animation:fade .35s ease}\n.panel.active{display:block}\n@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}\n.h2{font-size:20px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}\n.h2 .vi{font-size:13px;font-weight:400;color:var(--muted);font-family:'Andika',sans-serif}\n.lead{color:var(--muted);font-size:14px;margin-bottom:14px}\n.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}\n.spacer{height:14px}\n\n/* ===== Buttons ===== */\n.btn{\n  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;\n  background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:14px;min-height:44px;\n  transition:transform .12s,background .2s,box-shadow .2s;box-shadow:var(--shadow)\n}\n.btn:hover{background:var(--surface2)}\n.btn:active{transform:scale(.97)}\n.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}\n.btn.primary:hover{filter:brightness(1.1);background:var(--primary)}\n.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}\n.btn.accent:hover{filter:brightness(1.08);background:var(--accent)}\n.btn.small{padding:6px 12px;min-height:36px;font-size:13px}\n.btn[disabled]{opacity:.45;pointer-events:none}\n.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}\n.seg button{padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:500;min-height:38px}\n.seg button.on{background:var(--surface);box-shadow:var(--shadow);color:var(--primary);font-weight:700}\n\n/* ===== Chữ cái ===== */\n.letters r;gap:14px;align-items:center;text-align:left;transition:transform .15s,border-color .2s\n}\n.tone:hover{transform:translateY(-2px);border-color:var(--primary)}\n.tone svg.wave{width:96px;height:58px;background:var(--surface2);border-radius:10px}\n.tone .t1{font-family:'Andika',sans-serif;font-size:26px;font-weight:700;color:var(--primary)}\n.tone .t1 small{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}\n.tone .t2{font-size:13px;font-weight:700;color:var(--accent)}\n.tone .t3{font-size:13px;color:var(--muted)}\n.tone.seen{border-color:var(--good)}\n\n/* ===== Kiểm tra phát âm ===== */\n.target-card{text-align:center;padding:26px 16px}\n.target-card .tv{font-family:'Andika',sans-serif;font-size:clamp(40px,10vw,64px);font-weight:700;color:var(--primary);line-height:1.15}\n.target-card .tk{font-size:20px;font-weight:700;color:var(--accent);margin-top:6px}\n.target-card .tj{font-size:15px;color:var(--muted)}\n.mic{\n  width:92px;height:92px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;\n  box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .15s;margin:0 auto\n}\n.mic:active{transform:scale(.94)}\n.mic.listening{animation:pulse 1.2s infinite;background:var(--bad)}\n@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}100%{box-shadow:0 0 0 28px transparent}}\n.mic-label{text-align:center;font-size:13px;color:var(--muted);margin-top:8px;min-height:20px}\n.result{margin-top:16px}\n.result-in{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface2);border-radius:14px;padding:16px}\n.ring{position:relative;width:104px;height:104px}\n.ring svg{transform:rotate(-90deg)}\n.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:700}\n.ring .num small{font-size:12px;font-weight:500;margin-left:1px}\n.fb-title{font-size:18px;font-weight:700}\n.cmp{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px}\n.chip{padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-family:'Andika','Noto Sans JP',sans-serif}\n.chip.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}\n.chip.ng{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}\n.err{background:var(--bad-soft);color:var(--bad);padding:12px 14px;border-radius:12px;font-size:14px}\n.stats{display:flex;gap:18px;justify-content:center;margin-top:14px;font-size:13px;color:var(--muted)}\n.stats b{color:var(--ink);font-size:16px}\n\n/* ===== Luyện viết ===== */\n.write-wrap{display:grid;gap:14px}\n.canvas-box{background:var(--surface);border:2px dashed var(--line);border-radius:var(--radius);overflow:hidden;position:relative}\n#wCanvas{display:block;width:100%;height:min(62vw,340px);touch-action:none;cursor:crosshair}\n.wtop{display:flex;gap:10px;flex-wrap:wrap;align-items:center}\nselect{\n  font:inherit;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px\n}\n\n/* ===== Từ vựng ===== */\n.words{display:grid;gap:10px;margin-top:14px}\n.wrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}\n.wrow.done{border-color:var(--good);background:linear-gradient(90deg,var(--good-soft),var(--surface) 40%)}\n.wv{font-family:'Andika',sans-serif;font-size:21px;font-weight:700;color:var(--primary)}\n.wk{font-size:13px;font-weight:700;color:var(--accent);margin-left:8px}\n.wj{font-size:13px;color:var(--muted)}\n.wres{font-size:12.5px;margin-top:2px}\n.wbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}\n.rbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);transition:transform .12s}\n.rbtn:hover{background:var(--surface2)}\n.rbtn:active{transform:scale(.92)}\n.rbtn.listening{background:var(--bad);color:#fff;border-color:var(--bad);animation:pulse 1.2s infinite}\n.rbtn.on{background:var(--good);color:#fff;border-color:var(--good)}\n\n/* ===== Trắc nghiệm ===== */\n.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}\n.mode{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;text-align:left;transition:transform .15s,border-color .2s}\n.mode:hover{transform:translateY(-2px);border-color:var(--accent)}\n.mode b{display:block;font-size:16px;margin-bottom:2px}\n.mode span{font-size:13px;color:var(--muted)}\n.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:var(--muted)}\n.qbar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-bottom:16px}\n.qbar i{display:block;height:100%;background:var(--accent);transition:width .4s}\n.qprompt{font-size:17px;font-weight:700;text-align:center;margin-bottom:12px}\n.qshow{text-align:center;font-family:'Andika',sans-serif;font-size:72px;font-weight:700;color:var(--primary);margin:6px 0 14px;line-height:1.1}\n.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.opt{\n  padding:16px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;\n  font-family:'Andika','Noto Sans JP',sans-serif;min-height:64px;transition:transform .12s,background .2s,border-color .2s\n}\n.opt small{display:block;font-size:12px;font-weight:400;color:var(--muted);font-family:'Noto Sans JP',sans-serif}\n.opt:hover{border-color:var(--primary)}\n.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}\n.opt.ng{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}\n.opt[disabled]{pointer-events:none}\n.qfb{margin-top:14px;text-align:center;min-height:56px}\n.weak{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}\n.weak button{padding:6px 14px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-family:'Andika',sans-serif}\n\n/* ===== Thanh chọn giọng / cặp từ / câu giao tiếp ===== */\n.voicebar{max-width:1080px;margin:10px auto 0;padding:0 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}\n.voicebar select{min-height:38px;max-width:56vw;padding:6px 10px}\n.tone .tbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}\n.pairs{display:grid;gap:10px;margin-top:12px}\n.pair{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:stretch}\n.pbtn{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;transition:transform .12s,border-color .2s}\n.pbtn:hover{border-color:var(--primary)}\n.pbtn:active{transform:scale(.97)}\n.pbtn b{display:block;font-family:'Andika',sans-serif;font-size:24px;color:var(--primary)}\n.pbtn small{font-size:12px;color:var(--muted)}\n.pair .rbtn{height:auto;min-height:44px}\n.wk2{font-size:13px;font-weight:700;color:var(--accent)}\n.wrow.phrase .wv{font-size:18px;line-height:1.4}\n/* ===== Hộp mật khẩu ===== */\n.modal{position:fixed;inset:0;background:rgba(20,16,12,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}\n.modal.show{display:flex}\n.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:22px;width:100%;max-width:360px}\n.modal-box input{width:100%;font:inherit;font-size:18px;letter-spacing:4px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px}\n.modal-box input:focus{outline:none;border-color:var(--accent)}\n.pw-err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}\n/* ===== Phòng thu âm ===== */\n.sw{display:inline-flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}\n.sw input{width:20px;height:20px;accent-color:var(--accent)}\n.sprog{display:flex;align-items:center;gap:12px;margin-bottom:12px}\n.sbar{flex:1;height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}\n.sbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#f0a04b);transition:width .5s}\n.tips{margin:0 0 14px 18px;font-size:13.5px;color:var(--muted)}\n.tips li{margin-bottom:3px}\n.notice-in{background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:12px;font-size:14px;margin-bottom:12px}\n.studio-msg{display:none;margin-top:12px;padding:10px 14px;border-radius:12px;font-size:13.5px}\n.studio-msg.err{background:var(--bad-soft);color:var(--bad)}\n.studio-msg.ok{background:var(--good-soft);color:var(--good)}\n.studio-msg.warn{background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent)}\n.studio-list{display:grid;gap:8px;margin-top:12px}\n.srow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}\n.srow.has{border-color:var(--good)}\n.srow.rec{border-color:var(--bad);background:var(--bad-soft)}\n.srow.flash{animation:flashrow 1.6s}\n@keyframes flashrow{0%,60%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}\n.sv{font-family:'Andika',sans-serif;font-size:19px;font-weight:700;color:var(--primary);line-height:1.35}\n.sj{font-size:12.5px;color:var(--muted)}\n.smeter{display:none;height:5px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}\n.srow.rec .smeter{display:block}\n.smeter i{display:block;height:100%;width:0;background:var(--bad);transition:width .06s}\n.schip{font-size:12px;color:var(--muted);white-space:nowrap}\n.srow.has .schip{color:var(--good);font-weight:700}\n.sbtns{display:flex;gap:6px}\n.rbtn[disabled]{opacity:.35;pointer-events:none}\n@media (max-width:720px){.srow{grid-template-columns:1fr auto}.schip{grid-column:1;grid-row:2}.sbtns{grid-row:1/3;grid-column:2}}\n/* ===== Thông báo ===== */\n.notice{\n  max-width:1080px;margin:12px auto 0;padding:10px 16px;display:none\n}\n.notice.show{display:block}\n.notice div{background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13.5px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}\n.toast{\n  position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;\n  border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90vw;text-align:center\n}\n.toast.show{opacity:1;transform:translate(-50%,0)}\nfooter{max-width:1080px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:12.5px}\nfooter details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}\nfooter summary{cursor:pointer;font-weight:700;color:var(--ink)}\nfooter ul{margin:8px 0 0 18px}\n\n/* ===== Mobile ===== */\n@media (max-width:720px){\n  .brand small{display:none}\n  .progress{max-width:none}\n  .progress .pct{min-width:44px}\n  .tabs{\n    position:fixed;left:0;right:0;bottom:0;max-width:none;padding:6px 6px calc(6px + env(safe-area-inset-bottom));\n    background:var(--surface);border-top:1px solid var(--line);z-index:40;gap:2px;box-shadow:0 -4px 16px rgba(0,0,0,.08)\n  }\n  .tab{min-width:0;padding:6px 2px}\n  .tab .jp{font-size:12.5px}\n  .tab .vi{font-size:9.5px}\n  main{padding-bottom:100px}\n  .detail{grid-template-columns:1fr;text-align:center;justify-items:center}\n  .tone{grid-template-columns:84px 1fr}\n  .tone svg.wave{width:84px}\n  .result-in{grid-template-columns:1fr;justify-items:center;text-align:center}\n  .cmp{justify-content:center}\n  .wrow{grid-template-columns:1fr}\n  .wbtns{justify-content:flex-start}\n  .toast{bottom:90px}\n}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"topbar\">\n  \u003cdiv class=\"topbar-in\">\n    \u003cdiv class=\"brand\">\n      \u003cdiv class=\"logo\">Việt\u003c/div>\n      \u003cdiv>\n        \u003ch1>ベトナム語 文字と発音\u003c/h1>\n        \u003csmall>Chữ cái &amp; phát âm tiếng Việt\u003c/small>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"progress\" title=\"学習の進み具合\">\n      \u003cdiv class=\"bar\">\u003cdiv class=\"fill\" id=\"progFill\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"pct\" id=\"progPct\">0%\u003c/div>\n    \u003c/div>\n    \u003cbutton class=\"icon-btn\" id=\"studioBtn\" aria-label=\"録音スタジオ\" title=\"録音スタジオ\">\u003cspan data-ic=\"mic\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"icon-btn\" id=\"themeBtn\" aria-label=\"表示モードの切り替え\">\u003c/button>\n  \u003c/div>\n  \u003cnav class=\"tabs\" id=\"tabs\" role=\"tablist\">\n    \u003cbutton class=\"tab active\" data-tab=\"letters\" role=\"tab\">\u003cspan class=\"jp\">文字表\u003c/span>\u003cspan class=\"vi\">Chữ cái\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"tones\" role=\"tab\">\u003cspan class=\"jp\">声調\u003c/span>\u003cspan class=\"vi\">Thanh điệu\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"check\" role=\"tab\">\u003cspan class=\"jp\">発音\u003c/span>\u003cspan class=\"vi\">Kiểm tra\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"write\" role=\"tab\">\u003cspan class=\"jp\">書く\u003c/span>\u003cspan class=\"vi\">Luyện viết\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"words\" role=\"tab\">\u003cspan class=\"jp\">単語\u003c/span>\u003cspan class=\"vi\">Từ vựng\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"phrases\" role=\"tab\">\u003cspan class=\"jp\">会話\u003c/span>\u003cspan class=\"vi\">Hội thoại\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"quiz\" role=\"tab\">\u003cspan class=\"jp\">クイズ\u003c/span>\u003cspan class=\"vi\">Trắc nghiệm\u003c/span>\u003c/button>\n  \u003c/nav>\n\u003c/header>\n\n\u003cdiv class=\"voicebar\">\n  \u003cspan>音声：\u003c/span>\u003cselect id=\"voiceSel\" aria-label=\"音声の選択\">\u003c/select>\n  \u003cbutton class=\"btn small\" id=\"voiceTest\">テスト（sửa / sữa）\u003c/button>\n  \u003cspan class=\"vb-note\" id=\"voiceNote\">声が不自然なときは、別の音声を選ぶか、自分の声を録音できます。\u003c/span>\n  \u003cbutton class=\"btn small\" id=\"voiceStudio\">\u003cspan data-ic=\"mic\" data-size=\"16\">\u003c/span>録音スタジオ\u003c/button>\n  \u003cspan class=\"vb-note\" id=\"recCount\">\u003c/span>\n\u003c/div>\n\n\u003cdiv class=\"notice\" id=\"voiceNotice\">\n  \u003cdiv>\n    \u003cspan>お使いの端末にベトナム語の音声が見つかりません。端末の設定（言語・音声出力）からベトナム語の音声を追加すると、発音が正しく再生されます。\u003c/span>\n    \u003cbutton class=\"btn small\" id=\"noticeClose\">閉じる\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cmain>\n  \u003c!-- ===== 文字表 ===== -->\n  \u003csection class=\"panel active\" id=\"tab-letters\">\n    \u003cdiv class=\"h2\">ベトナム語のアルファベット \u003cspan class=\"vi\">29 chữ cái\u003c/span>\u003c/div>\n    \u003cp class=\"lead\">文字をタップすると音が流れます。母音は赤、子音は青で表示されます。\u003c/p>\n    \u003cdiv class=\"letters-layout\">\n      \u003cdiv class=\"card detail\" id=\"detail\">\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"seg\" id=\"letterFilter\">\n          \u003cbutton class=\"on\" data-f=\"all\">すべて\u003c/button>\n          \u003cbutton data-f=\"v\">母音（12）\u003c/button>\n          \u003cbutton data-f=\"c\">子音（17）\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"spacer\">\u003c/div>\n        \u003cdiv class=\"grid\" id=\"letterGrid\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ===== 声調 ===== -->\n  \u003csection class=\"panel\" id=\"tab-tones\">\n    \u003cdiv class=\"h2\">6つの声調 \u003cspan class=\"vi\">6 thanh điệu\u003c/span>\u003c/div>\n    \u003cp class=\"lead\">同じ「ma」でも、声調が違うと意味が変わります。「発音」で音声、「ピッチ音」で声の高さの動きだけを聞けます。\u003c/p>\n    \u003cdiv class=\"row\" style=\"margin-bottom:14px\">\n      \u003cbutton class=\"btn primary\" id=\"toneAll\">\u003cspan data-ic=\"speaker\">\u003c/span>6つ続けて聞く\u003c/button>\n      \u003cbutton class=\"btn\" id=\"toneAllSlow\">\u003cspan data-ic=\"slow\">\u003c/span>ゆっくり続けて聞く\u003c/button>\n      \u003cbutton class=\"btn\" id=\"toneAllMel\">\u003cspan data-ic=\"wave\">\u003c/span>ピッチ音で6つ聞く\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"tone-grid\" id=\"toneGrid\">\u003c/div>\n\n    \u003cdiv class=\"h2\" style=\"margin-top:30px\">聞き分けトレーニング \u003cspan class=\"vi\">Cặp từ dễ nhầm\u003c/span>\u003c/div>\n    \u003cp class=\"lead\">声調だけが違う実在の単語です。特に hỏi（?）と ngã（~）は、ペアで続けて聞いて違いを確かめましょう。\u003c/p>\n    \u003cdiv class=\"seg\" id=\"pairSeg\">\u003c/div>\n    \u003cdiv class=\"pairs\" id=\"pairList\">\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ===== 発音チェック ===== -->\n  \u003csection class=\"panel\" id=\"tab-check\">\n    \u003cdiv class=\"h2\">発音チェック \u003cspan class=\"vi\">Kiểm tra phát âm\u003c/span>\u003c/div>\n    \u003cp class=\"lead\">お手本を聞いて、マイクに向かって読んでみましょう。認識結果と比べて点数が出ます。\u003c/p>\n    \u003cdiv class=\"row\" style=\"margin-bottom:14px\">\n      \u003cdiv class=\"seg\" id=\"checkSrc\">\n        \u003cbutton class=\"on\" data-s=\"letters\">文字の例語\u003c/button>\n        \u003cbutton data-s=\"tones\">声調\u003c/button>\n        \u003cbutton data-s=\"words\">単語\u003c/button>\n        \u003cbutton data-s=\"phrases\">会話文\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card target-card\">\n      \u003cdiv class=\"tv\" id=\"ckVi\">—\u003c/div>\n      \u003cdiv class=\"tk\" id=\"ckKana\">\u003c/div>\n      \u003cdiv class=\"tj\" id=\"ckJa\">\u003c/div>\n      \u003cdiv class=\"row\" style=\"justify-content:center;margin:16px 0\">\n        \u003cbutton class=\"btn\" id=\"ckPlay\">\u003cspan data-ic=\"speaker\">\u003c/span>お手本を聞く\u003c/button>\n        \u003cbutton class=\"btn\" id=\"ckSlow\">\u003cspan data-ic=\"slow\">\u003c/span>ゆっくり\u003c/button>\n      \u003c/div>\n      \u003cbutton class=\"mic\" id=\"ckMic\" aria-label=\"録音して話す\">\u003cspan data-ic=\"mic\" data-size=\"38\">\u003c/span>\u003c/button>\n      \u003cdiv class=\"mic-label\" id=\"ckMicLabel\">マイクを押して話してください\u003c/div>\n      \u003cdiv class=\"row\" style=\"justify-content:center;margin-top:14px\">\n        \u003cbutton class=\"btn small\" id=\"ckPrev\">← 前へ\u003c/button>\n        \u003cbutton class=\"btn small\" id=\"ckRand\">ランダム\u003c/button>\n        \u003cbutton class=\"btn small\" id=\"ckNext\">次へ →\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"result\" id=\"ckResult\">\u003c/div>\n      \u003cdiv class=\"stats\">\u003cspan>今回の挑戦 \u003cb id=\"ckCount\">0\u003c/b> 回\u003c/span>\u003cspan>平均点 \u003cb id=\"ckAvg\">—\u003c/b>\u003c/span>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ===== 書く練習 ===== -->\n  \u003csection class=\"panel\" id=\"tab-write\">\n    \u003cdiv class=\"h2\">書く練習 \u003cspan class=\"vi\">Luyện viết\u003c/span>\u003c/div>\n    \u003cp class=\"lead\">指またはマウスで書きましょう。薄い手本をなぞったあと、手本なしで自力でも挑戦してみてください。\u003c/p>\n    \u003cdiv class=\"write-wrap\">\n      \u003cdiv class=\"wtop\">\n        \u003cbutton class=\"btn small\" id=\"wPrev\">← 前へ\u003c/button>\n        \u003cselect id=\"wTarget\" aria-label=\"練習する文字\">\u003c/select>\n        \u003cbutton class=\"btn small\" id=\"wNext\">次へ →\u003c/button>\n        \u003cbutton class=\"btn small\" id=\"wSay\">\u003cspan data-ic=\"speaker\">\u003c/span>音を聞く\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"canvas-box\">\u003ccanvas id=\"wCanvas\">\u003c/canvas>\u003c/div>\n      \u003cdiv class=\"wtop\">\n        \u003cdiv class=\"seg\" id=\"wMode\">\n          \u003cbutton class=\"on\" data-m=\"trace\">なぞる\u003c/button>\n          \u003cbutton data-m=\"free\">自力で書く\u003c/button>\n        \u003c/div>\n        \u003cbutton class=\"btn\" id=\"wGuide\">\u003cspan data-ic=\"eye\">\u003c/span>手本を表示／隠す\u003c/button>\n        \u003cbutton class=\"btn\" id=\"wUndo\">\u003cspan data-ic=\"undo\">\u003c/span>ひとつ戻す\u003c/button>\n        \u003cbutton class=\"btn accent\" id=\"wClear\">\u003cspan data-ic=\"trash\">\u003c/span>全部消す\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ===== 単語 ===== -->\n  \u003csection class=\"panel\" id=\"tab-words\">\n    \u003cdiv class=\"h2\">単語を読む練習 \u003cspan class=\"vi\">Luyện đọc từ\u003c/span>\u003c/div>\n    \u003cp class=\"lead\">聞く・まねして読む・採点。覚えた単語には「覚えた」をつけましょう。\u003c/p>\n    \u003cdiv class=\"row\" style=\"justify-content:space-between\">\n      \u003cdiv class=\"seg\" id=\"topicSeg\">\u003c/div>\n      \u003cspan class=\"chip\" id=\"wordCount\">\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"words\" id=\"wordList\">\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ===== 会話 ===== -->\n  \u003csection class=\"panel\" id=\"tab-phrases\">\n    \u003cdiv class=\"h2\">あいさつと日常会話 \u003cspan class=\"vi\">Câu giao tiếp thường dùng\u003c/span>\u003c/div>\n    \u003cp class=\"lead\">旅行や生活でよく使う表現です。聞く・まねして読む・採点で練習しましょう。\u003c/p>\n    \u003cdiv class=\"row\" style=\"justify-content:space-between\">\n      \u003cdiv class=\"seg\" id=\"phraseSeg\">\u003c/div>\n      \u003cspan class=\"chip\" id=\"phraseCount\">\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"words\" id=\"phraseList\">\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ===== 録音スタジオ ===== -->\n  \u003csection class=\"panel\" id=\"tab-studio\">\n    \u003cdiv class=\"h2\">録音スタジオ \u003cspan class=\"vi\">Thu âm giọng thật\u003c/span>\u003c/div>\n    \u003cp class=\"lead\">先生やネイティブの方の声を録音して、アプリの音声として使えます。録音した項目は、機械音声の代わりにその声で再生されます。録音がない項目は、これまで通り端末の音声で再生されます。\u003c/p>\n    \u003cdiv class=\"card studio-top\">\n      \u003cdiv class=\"notice-in\" id=\"studioSupport\" style=\"display:none\">お使いのブラウザは録音に対応していません。Chrome・Edge・Safari の最新版でお試しください。\u003c/div>\n      \u003cdiv class=\"sprog\">\u003cdiv class=\"sbar\">\u003ci id=\"studioFill\">\u003c/i>\u003c/div>\u003cb id=\"studioCount\">0 / 0\u003c/b>\u003c/div>\n      \u003cul class=\"tips\">\n        \u003cli>静かな場所で、口から10〜15cm離して、ゆっくりはっきり読みます。\u003c/li>\n        \u003cli>録音ボタンを押して話し、もう一度押すと止まります（8秒で自動停止）。保存後は自動で再生されるので、すぐ確認できます。\u003c/li>\n        \u003cli id=\"studioLocalNote\">録音はこの端末のブラウザに保存されます。別の端末や別のブラウザで使うには「バックアップを保存」で書き出し、「読み込む」で取り込んでください。\u003c/li>\n        \u003cli>同じ言葉は1回の録音で、アプリ内のすべての場所に使われます。\u003c/li>\n        \u003cli id=\"studioCloudNote\" style=\"display:none\">この画面は管理者だけが使えます。録音はクラウド（Firestore）に保存され、ログインしたすべての学習者が同じ声で聞けます。\u003c/li>\n      \u003c/ul>\n      \u003clabel class=\"sw\">\u003cinput type=\"checkbox\" id=\"useRec\"> 録音した声を優先して再生する\u003c/label>\n      \u003cdiv class=\"row\" style=\"margin-top:12px\">\n        \u003cbutton class=\"btn accent\" id=\"studioNext\">次の未録音へ\u003c/button>\n        \u003cbutton class=\"btn\" id=\"studioExport\">バックアップを保存\u003c/button>\n        \u003cbutton class=\"btn\" id=\"studioImport\">バックアップを読み込む\u003c/button>\n        \u003cbutton class=\"btn\" id=\"studioClear\">すべて削除\u003c/button>\n        \u003cinput type=\"file\" id=\"importFile\" accept=\"application/json,.json\" hidden>\n      \u003c/div>\n      \u003cdiv class=\"studio-msg\" id=\"studioMsg\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"spacer\">\u003c/div>\n    \u003cdiv class=\"seg\" id=\"studioSeg\">\u003c/div>\n    \u003cdiv class=\"studio-list\" id=\"studioList\">\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ===== クイズ ===== -->\n  \u003csection class=\"panel\" id=\"tab-quiz\">\n    \u003cdiv class=\"h2\">クイズ \u003cspan class=\"vi\">Trắc nghiệm\u003c/span>\u003c/div>\n    \u003cdiv id=\"quizBox\">\u003c/div>\n  \u003c/section>\n\u003c/main>\n\n\u003cfooter>\n  \u003cdetails>\n    \u003csummary>使い方と注意点\u003c/summary>\n    \u003cul>\n      \u003cli>音声の品質は、お使いの端末・ブラウザのベトナム語音声によって変わります。画面上部の「音声」で別の音声を選べます。声調の確認には「ピッチ音」と「聞き分けトレーニング」も使ってください。\u003c/li>\n      \u003cli>発音チェックは音声認識（Chrome / Edge 推奨、インターネット接続が必要）を使います。点数は「認識された文字列との一致度」で、発音の完全な評価ではありません。\u003c/li>\n      \u003cli>マイクの使用を求められたら「許可」を選んでください。\u003c/li>\n      \u003cli>先生やネイティブの方の声を、画面上部の「録音スタジオ」から録音できます。録音した声は機械音声より優先して再生されます。\u003c/li>\n      \u003cli>学習の進み具合は、このブラウザに保存されます（保存できない環境では、ページを閉じるまで保持されます）。\u003c/li>\n    \u003c/ul>\n  \u003c/details>\n\u003c/footer>\n\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\n\u003cdiv class=\"modal\" id=\"pwModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"pwTitle\">\n  \u003cdiv class=\"modal-box\">\n    \u003cdiv class=\"h2\" id=\"pwTitle\" style=\"margin-bottom:6px\">録音スタジオ \u003cspan class=\"vi\">Phòng thu âm\u003c/span>\u003c/div>\n    \u003cp class=\"lead\" style=\"margin-bottom:12px\">録音には、先生用のパスワードが必要です。\u003c/p>\n    \u003cinput type=\"password\" id=\"pwInput\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"パスワード\" aria-label=\"パスワード\">\n    \u003cdiv class=\"pw-err\" id=\"pwErr\" role=\"alert\">\u003c/div>\n    \u003cdiv class=\"row\" style=\"justify-content:flex-end;margin-top:14px\">\n      \u003cbutton class=\"btn\" id=\"pwCancel\">キャンセル\u003c/button>\n      \u003cbutton class=\"btn accent\" id=\"pwOk\">開く\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n/* =========================================================\n   1. DỮ LIỆU (tách riêng để dễ chỉnh sửa)\n   ========================================================= */\n\n// [chữ thường, loại (v=nguyên âm / c=phụ âm), tên đọc, katakana, từ ví dụ, katakana từ, nghĩa JP, mẹo phát âm]\nconst LETTER_DATA = [\n['a','v','a','アー','ba','バー','お父さん','口を大きく開けて「アー」。日本語の「ア」とほぼ同じ音です。'],\n['ă','v','á','ア(短)','ăn','アン','食べる','「ア」を短く切って発音します。aより短く、口はやや横に。'],\n['â','v','ớ','オ(短)','ấm','オム','温かい','口をあまり開けず、短く「ウ」と「ア」の中間のような音を出します。'],\n['b','c','bê','ベー','bàn','バン','机','唇を閉じて出す「ブ」。日本語のバ行に近い音です。'],\n['c','c','xê','セー','cá','カー','魚','「ク」に近い音。息を強く出さず、喉の奥で止めます。'],\n['d','c','dê','ゼー','dê','ゼー','ヤギ','北部では「ザ」行、南部では「ヤ」行に近い音です。'],\n['đ','c','đê','デー','đi','ディー','行く','日本語のダ行に近い音。dとは別の文字です。'],\n['e','v','e','エ','em','エム','弟・妹','日本語の「エ」より口を横に広く開けます。'],\n['ê','v','ê','エー','ếch','エック','カエル','日本語の「エ」に近く、口をやや狭めて出します。'],\n['g','c','giê','ジェー','gà','ガー','鶏','喉の奥で出す「ガ」。「ガ」と「ハ」の間のような音です。'],\n['h','c','hát','ハット','hoa','ホア','花','日本語のハ行に近い音です。'],\n['i','v','i','イー','ít','イット','少ない','日本語の「イ」とほぼ同じ音です。'],\n['k','c','ca','カー','kem','ケム','アイスクリーム','「カ」に近い音。e・ê・i の前で使います。'],\n['l','c','e-lờ','エロ','lá','ラー','葉','舌先を上の歯ぐきにつけて出す「ラ」です。'],\n['m','c','em-mờ','エモ','mèo','メオ','猫','日本語のマ行とほぼ同じ音です。'],\n['n','c','en-nờ','エンノ','nước','ヌオック','水','日本語のナ行とほぼ同じ音です。'],\n['o','v','o','オ(広)','ong','オン','ハチ','口を丸く大きく開けて出す「オ」です。'],\n['ô','v','ô','オー','ô tô','オー・トー','自動車','唇をすぼめて出す「オ」。日本語の「オ」に近い音です。'],\n['ơ','v','ơ','ウァ','cơm','コム','ご飯','唇を丸めずに出す、「ウ」と「ア」の間の音です。'],\n['p','c','pê','ペー','pin','ピン','電池','外来語に多い文字。日本語のパ行に近い音です。'],\n['q','c','cu','クー','quả','クア','果物・実','必ず qu の形で使い、「クア」のように発音します。'],\n['r','c','e-rờ','エ・ロ','rau','ザウ','野菜','北部では「ザ」、南部では舌を巻く「ラ」に近い音です。'],\n['s','c','ét-sì','エット・シー','sách','サック','本','北部では「サ」、南部では「シャ」に近い音です。'],\n['t','c','tê','テー','tay','タイ','手','息を強く出さない「タ」です。'],\n['u','v','u','ウー','uống','ウオン','飲む','唇を丸めて出す「ウ」です。'],\n['ư','v','ư','ウー(横)','thư','トゥー','手紙','唇を丸めず、横に引いて出す「ウ」です。'],\n['v','c','vê','ヴェー','vui','ヴイ','嬉しい','下唇を軽く噛んで出す「ヴ」です。'],\n['x','c','ích-xì','イック・シー','xe','セー','車・乗り物','日本語のサ行に近い音です。'],\n['y','v','i dài','イー・ザイ','y tá','イー・ター','看護師','i と同じ音です。「長いi」と呼ばれます。'],\n];\n// sp = chuỗi dùng để đọc (bỏ dấu gạch nối để giọng đọc không bị vấp)\nconst LETTERS = LETTER_DATA.map(a => ({l:a[0], type:a[1], say:a[2], sp:a[2].replace(/-/g,' '), kana:a[3], w:a[4], wk:a[5], wj:a[6], tip:a[7]}));\n\n// Thanh điệu: contour = các đoạn đường nét cao độ trong khung 100x60 (y nhỏ = cao)\nconst TONES = [\n {n:'ngang', jp:'平らな声調', mark:'a', ex:'ma', m:'幽霊', desc:'高めの音を平らにまっすぐ伸ばします。', seg:[[[8,18],[92,18]]]},\n {n:'huyền', jp:'下がる声調', mark:'à', ex:'mà', m:'しかし', desc:'やや低めから、静かに下げていきます。', seg:[[[8,22],[92,46]]]},\n {n:'sắc',   jp:'上がる声調', mark:'á', ex:'má', m:'頬・お母さん', desc:'中くらいの高さから、一気に上げます。', seg:[[[8,36],[92,8]]]},\n {n:'hỏi',   jp:'深く下がって上がる声調（?）', mark:'ả', ex:'mả', m:  = [];\nTOPICS.forEach(t => t.words.forEach(w => ALLWORDS.push({id:t.id+':'+w[0], vi:w[0], kana:w[1], ja:w[2], group:t.id})));\n\n\n// Câu giao tiếp thường dùng: [tiếng Việt, nghĩa tiếng Nhật, cách đọc katakana (gần đúng)]\nconst PHRASE_GROUPS = [\n {id:'greet',jp:'あいさつ'},{id:'intro',jp:'自己紹介'},{id:'basic',jp:'基本表現'},{id:'shop',jp:'買い物'},\n {id:'eat',jp:'食事'},{id:'move',jp:'移動'},{id:'help',jp:'困ったとき'},{id:'time',jp:'時間・天気'}];\nconst PHRASE_DATA = {\n greet:[\n  ['Xin chào.','こんにちは。','シン チャオ'],\n  ['Chào buổi sáng.','おはようございます。','チャオ ブオイ サン'],\n  ['Chào buổi tối.','こんばんは。','チャオ ブオイ トイ'],\n  ['Chúc ngủ ngon.','おやすみなさい。','チュック ングー ゴン'],\n  ['Bạn khỏe không?','お元気ですか？','バン クエ コーン'],\n  ['Tôi khỏe, cảm ơn.','元気です、ありがとう。','トイ クエ、カム オン'],\n  ['Rất vui được gặp bạn.','お会いできて嬉しいです。','ザット ヴイ ドゥオック ガップ バン'],\n  ['Hẹn gặp lại.','また会いましょう。','ヘン ガップ ライ'],\n  ['Tạm biệt.','さようなら。','タム ビエット']],\n intro:[\n  ['Tôi tên là Yuki.','私の名前はユキです。','トイ テン ラー ユキ'],\n  ['Bạn tên là gì?','お名前は何ですか？','バン テン ラー ジー'],\n  ['Tôi là người Nhật.','私は日本人です。','トイ ラー グオイ ニャット'],\n  ['Bạn là người nước nào?','どちらの国の方ですか？','バン ラー グオイ ヌオック ナオ'],\n  ['Tôi là sinh viên.','私は学生です。','トイ ラー シン ヴィエン'],\n  ['Tôi đang học tiếng Việt.','私はベトナム語を勉強しています。','トイ ダン ホック ティエン ヴィエット'],\n  ['Tôi sống ở Tokyo.','私は東京に住んでいます。','トイ ソン オー トーキョー'],\n  ['Tôi làm việc ở công ty.','私は会社で働いています。','トイ ラム ヴィエック オー コン ティ'],\n  ['Rất mong được giúp đỡ.','どうぞよろしくお願いします。','ザット モン ドゥオック ズップ ド']],\n basic:[\n  ['Cảm ơn bạn.','ありがとう。','カム オン バン'],\n  ['Cảm ơn rất nhiều.','どうもありがとうございます。','カム オン ザット ニュー'],\n  ['Không có gì.','どういたしまして。','コーン コー ジー'],\n  ['Xin lỗi.','ごめんなさい。すみません。','シン ロイ'],\n  ['Không sao.','大丈夫です。','コーン サオ'],\n  ['Làm ơn.','お願いします。','ラム オン'],\n  ['Vâng, tôi hiểu.','はい、わかりました。','ヴァン、トイ ヒエウ'],\n  ['Tôi không hiểu.','わかりません。','トイ コーン ヒエウ'],\n  ['Bạn có thể nói chậm hơn không?','もう少しゆっくり話してもらえますか？','バン コー テー ノイ チャム ホン コーン'],\n  ['Bạn có thể nhắc lại không?','もう一度言ってもらえますか？','バン コー テー ニャック ライ コーン'],\n  ['Cái này tiếng Việt gọi l
